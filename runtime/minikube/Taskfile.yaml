version: "3"

# ─────────────────────────────────────────────────────────────────────────────
# runtime/minikube — making a locally built image runnable by a minikube cluster,
# with no registry in the loop.
#
#   includes:
#     local: { taskfile: '{{.TASKLIB}}/runtime/minikube{{.TASKLIB_REF}}', dir: . }
#
# Every runtime under runtime/ exposes the same three tasks — `check`,
# `image:load`, `install` — so switching from one to another is a one-line
# change in the consumer's includes and nothing else.
#
# ── Inputs ───────────────────────────────────────────────────────────────────
# The same vars the `release` module reads: PROJECT_NAME, REGISTRY,
# IMAGE_NAMESPACE, CHART_DIR, K8S_NAMESPACE, K8S_CONTEXT. Include this
# alongside `release`, not instead of it: `image:load` moves what
# `release:image:build` produced.
# ─────────────────────────────────────────────────────────────────────────────

silent: true

# `_REL_VERSION` and `_REL_IMAGE` below come from the `release` module: every included
# file shares one var namespace, so its derived values are readable here. Do
# NOT shell out to `task release:version` for them — that re-loads the consumer
# Taskfile, which re-includes this module, which asks again: an infinite fork.

vars:
  _RT_SVC: '{{.PROJECT_NAME | default "service"}}'
  _RT_CHART_DIR: '{{.CHART_DIR | default "./deploy/chart"}}'
  _RT_K8S_NS: '{{.K8S_NAMESPACE | default "default"}}'
  _RT_CTX: '{{.K8S_CONTEXT | default "minikube"}}'

tasks:

  check:
    desc: "Fail early when the minikube cluster is not running"
    preconditions:
      - sh: command -v minikube >/dev/null
        msg: "minikube is not installed"
      - sh: minikube status --format '{{"{{"}}.Host{{"}}"}}' 2>/dev/null | grep -qx Running
        msg: "the minikube cluster is not running — `minikube start`"
    cmds:
      - echo "✔ {{._RT_SVC}} · local · minikube running"

  image:load:
    desc: "Copy the built image into minikube's own image store"
    # minikube runs its own daemon, so an image in the host's store is invisible
    # to it. `image load` moves it across; `eval $(minikube docker-env)` before
    # the build is the other way, and it leaks env into everything that follows.
    deps: [check]
    cmds:
      - echo "▸ {{._RT_SVC}} · local · minikube image load {{._REL_IMAGE}}:{{._REL_VERSION}}"
      - minikube image load {{._REL_IMAGE}}:{{._REL_VERSION}}
      - echo "✔ {{._RT_SVC}} · local · image inside minikube"

  install:
    desc: "helm upgrade --install from the chart directory, running the local image"
    # No registry in the path: the chart is installed from disk and the image
    # is pinned to the tag just built, with IfNotPresent so nothing is pulled.
    deps: [check]
    cmds:
      - task: image:load
      - echo "▸ {{._RT_SVC}} · local · helm upgrade --install into {{._RT_CTX}}/{{._RT_K8S_NS}}"
      - >-
        helm upgrade --install {{._RT_SVC}} {{._RT_CHART_DIR}}
        --kube-context {{._RT_CTX}}
        --namespace {{._RT_K8S_NS}} --create-namespace
        --set image.tag={{._REL_VERSION}}
        --set image.pullPolicy=IfNotPresent
        {{.HELM_UPGRADE_FLAGS | default ""}}
        {{if .VALUES}}--values {{.VALUES}}{{end}}
      - echo "✔ {{._RT_SVC}} · local · {{._REL_VERSION}} installed into {{._RT_CTX}}"
