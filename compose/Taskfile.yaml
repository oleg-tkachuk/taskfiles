version: "3"

# ─────────────────────────────────────────────────────────────────────────────
# compose — the local dependency stack (Postgres, Redis, queues, …).
#
#   includes:
#     compose:
#       taskfile: '{{.TASKLIB}}compose{{.TASKLIB_REF}}'
#       dir: .
#       vars: { COMPOSE_FILE: docker-compose.dev.yaml }
#
# `up` waits for health checks, so a task chained after it does not race the
# seeding. Everything here is idempotent: `up` on a running healthy stack is a
# no-op, and `down` on an absent one is the desired end state, not an error.
#
# ── Inputs ───────────────────────────────────────────────────────────────────
#   COMPOSE_FILE   default docker-compose.yaml
#   PROJECT_NAME   the label in every log line
#   SERVICE        narrow `logs` to one service
#   TAIL           backlog for `logs`                     (default 200)
# ─────────────────────────────────────────────────────────────────────────────

silent: true

vars:
  _CMP_FILE: '{{.COMPOSE_FILE | default "docker-compose.yaml"}}'
  _CMP_CMD: 'docker compose -f {{.COMPOSE_FILE | default "docker-compose.yaml"}}'
  _CMP_NAME: '{{.PROJECT_NAME | default "stack"}}'

tasks:

  up:
    desc: "Start the stack and wait until every service is healthy"
    preconditions:
      - sh: test -f {{._CMP_FILE}}
        msg: "{{._CMP_FILE}} not found (set COMPOSE_FILE)"
    cmds:
      - echo "▸ {{._CMP_NAME}} · compose · up ({{._CMP_FILE}})"
      - "{{._CMP_CMD}} up -d --wait"
      - task: ps
      - echo "✔ {{._CMP_NAME}} · compose · stack healthy"

  build:
    desc: "Rebuild the images the stack is composed of, then start it"
    cmds:
      - "{{._CMP_CMD}} up -d --build --wait"
      - echo "✔ {{._CMP_NAME}} · compose · rebuilt and healthy"

  down:
    desc: "Stop the stack. Volumes are preserved."
    cmds:
      - "{{._CMP_CMD}} down"
      - echo "✔ {{._CMP_NAME}} · compose · stopped (volumes kept)"

  reset:
    desc: "Stop the stack and DELETE its volumes — local data is lost"
    prompt: "Delete every volume of {{._CMP_FILE}}? Local database contents are lost."
    cmds:
      - "{{._CMP_CMD}} down -v"
      - echo "✔ {{._CMP_NAME}} · compose · torn down, volumes dropped"

  ps:
    desc: "Show what is running"
    cmds:
      - "{{._CMP_CMD}} ps"

  logs:
    desc: "Tail the stack's logs (SERVICE=… for one of them)"
    interactive: true
    cmds:
      - "{{._CMP_CMD}} logs -f --tail={{.TAIL | default \"200\"}} {{.SERVICE | default \"\"}}"
