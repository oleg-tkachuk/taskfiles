version: "3"

# ─────────────────────────────────────────────────────────────────────────────
# python — Poetry-managed Python projects.
#
#   includes:
#     python: { taskfile: '{{printf .TASKLIB "python/poetry"}}', dir: . }
#
# ── Inputs ───────────────────────────────────────────────────────────────────
# Pass these at the include's own `vars:`, not the consumer's top-level
# `vars:`. In a repository with more than one component the top level is
# shared with every other component — see README.md#variable-scoping.
#
#   PROJECT_NAME           label in log lines
#   PY                     interpreter to build the venv on (default python3)
#   PY_SRC                 source directory for lint/format  (default src)
#   PY_TEST_FLAGS          default "-q"
#   POETRY_INSTALL_FLAGS   e.g. "--no-interaction --no-root"
#
# The three tools each task runs are inputs, not assumptions. ruff, pytest and
# mypy are the defaults because they are what most projects reach for; a project
# on black, flake8 or pyright sets the command rather than doing without the
# task.
#
#   TEST_CMD        default pytest
#   LINT_CMD        default "ruff check"
#   FORMAT_CMD      default "ruff format"
#   TYPECHECK_CMD   default mypy
#   TYPECHECK_MODULE  what typecheck probes for before running (default mypy)
#
# Pin PY to the interpreter the deployed image runs. Left at the default, a
# pyproject that admits ">=3.13,<4.0" also admits 3.14, and a venv built on the
# newer one falls back to source builds for native deps that ship no wheel for
# it yet — a Rust toolchain in the middle of `poetry install`. Set it per
# project, and move it when the runtime moves.
# ─────────────────────────────────────────────────────────────────────────────

silent: true

vars:
  _PY_NAME: '{{.PROJECT_NAME | default "python"}}'
  _PY_BIN: '{{.PY | default "python3"}}'
  _PY_SRC: '{{.PY_SRC | default "src"}}'
  _PY_TEST_CMD: '{{.TEST_CMD | default "pytest"}}'
  _PY_LINT_CMD: '{{.LINT_CMD | default "ruff check"}}'
  _PY_FMT_CMD: '{{.FORMAT_CMD | default "ruff format"}}'
  _PY_TC_CMD: '{{.TYPECHECK_CMD | default "mypy"}}'
  _PY_TC_MOD: '{{.TYPECHECK_MODULE | default "mypy"}}'
  _PY_TEST_FLAGS: '{{.PY_TEST_FLAGS | default "-q"}}'
  _PY_UPDATE_FLAGS: '{{.POETRY_UPDATE_FLAGS | default ""}}'
  _PY_LOCK_FLAGS: '{{.POETRY_LOCK_FLAGS | default ""}}'
  _PY_INSTALL_FLAGS: '{{.POETRY_INSTALL_FLAGS | default "--no-interaction"}}'
  # Status markers. The shape carries the meaning, so a line still reads in
  # a monochrome log; the colour sits on top and drops out under NO_COLOR.
  _PY_RUN: '{{if .NO_COLOR}}◉{{else}}{{"\x1b[36m◉\x1b[0m"}}{{end}}'
  _PY_OK: '{{if .NO_COLOR}}✔{{else}}{{"\x1b[32m✔\x1b[0m"}}{{end}}'
  _PY_WARN: '{{if .NO_COLOR}}▲{{else}}{{"\x1b[33m▲\x1b[0m"}}{{end}}'
  _PY_ERR: '{{if .NO_COLOR}}✖{{else}}{{"\x1b[31m✖\x1b[0m"}}{{end}}'

tasks:

  doctor:
    desc: "Check that the interpreter, lock and project this component declares resolve"
    # A report rather than a gate chain, the shape release:doctor uses.
    #
    # PY is the line that earned it. It names the interpreter the deployed
    # image runs, it is an input, and in a monorepo a sibling component's
    # top-level `vars:` can supply it (see README.md#variable-scoping) — so
    # the version a venv is built on is not always the one this component
    # wrote down. Nothing else prints it.
    cmds:
      - cmd: |-
          set -u
          fail=0

          say() { printf '%s %s · doctor · %s\n' "$1" '{{._PY_NAME}}' "$2"; }
          bad() { say '{{._PY_ERR}}' "$1" >&2; fail=1; }

          command -v poetry >/dev/null 2>&1 \
            && say '{{._PY_OK}}' "poetry $(poetry --version 2>/dev/null | sed 's/[^0-9.]*//;s/).*//')" \
            || bad "poetry is not installed — https://python-poetry.org/docs/#installation"

          # The interpreter by the name this module will hand poetry, not by
          # whatever `python3` happens to be: those differ exactly when PY is
          # wrong, which is the case worth catching.
          if command -v '{{._PY_BIN}}' >/dev/null 2>&1; then
            say '{{._PY_OK}}' "interpreter {{._PY_BIN}} ($('{{._PY_BIN}}' -V 2>&1))"
          else
            bad "interpreter {{._PY_BIN}} is not on PATH — PY names it, and nothing else here checks"
          fi

          if [ ! -f pyproject.toml ]; then
            bad "no pyproject.toml here — is the include missing dir: . ?"
          else
            say '{{._PY_OK}}' "pyproject.toml is here"
            [ -f poetry.lock ] \
              && say '{{._PY_OK}}' "poetry.lock is here" \
              || say '{{._PY_WARN}}' "no poetry.lock yet — run lock before install"
            [ -d '{{._PY_SRC}}' ] \
              || say '{{._PY_WARN}}' "PY_SRC {{._PY_SRC}} is not a directory — lint and format would find nothing"
          fi

          say '{{._PY_OK}}' "install flags {{._PY_INSTALL_FLAGS}}"

          [ "$fail" = 0 ] && say '{{._PY_OK}}' "ready"
          exit "$fail"

  install:
    desc: "poetry install (skipped when pyproject and the lockfile are unchanged)"
    # Fingerprinted on the manifests, so re-running after an unrelated edit
    # costs nothing — which is what makes it safe to put in a deps list.
    sources:
      - pyproject.toml
      - poetry.lock
    preconditions:
      - sh: command -v poetry >/dev/null
        msg: "poetry is not installed — https://python-poetry.org/docs/#installation"
      - sh: command -v {{._PY_BIN}} >/dev/null
        msg: "{{._PY_BIN}} is not on PATH — install it or pass PY=<interpreter>"
    cmds:
      - printf '%s\n' "{{._PY_RUN}} {{._PY_NAME}} · py · poetry install ({{._PY_BIN}})"
      - poetry env use {{._PY_BIN}} >/dev/null
      - poetry install {{._PY_INSTALL_FLAGS}}
      - printf '%s\n' "{{._PY_OK}} {{._PY_NAME}} · py · dependencies installed"

  test:
    desc: "pytest"
    deps: [install]
    cmds:
      - printf '%s\n' "{{._PY_RUN}} {{._PY_NAME}} · py · {{._PY_TEST_CMD}}"
      - poetry run {{._PY_TEST_CMD}} {{._PY_TEST_FLAGS}}
      - printf '%s\n' "{{._PY_OK}} {{._PY_NAME}} · py · tests pass"

  lint:
    desc: "ruff check"
    deps: [install]
    cmds:
      - printf '%s\n' "{{._PY_RUN}} {{._PY_NAME}} · py · {{._PY_LINT_CMD}}"
      - poetry run {{._PY_LINT_CMD}} {{._PY_SRC}}
      - printf '%s\n' "{{._PY_OK}} {{._PY_NAME}} · py · lint clean"

  fmt:
    desc: "ruff format"
    # `fmt` to match the Go module's verb for the same operation; `format` is
    # what ruff calls it, so it stays as an alias.
    aliases: [format]
    deps: [install]
    cmds:
      - poetry run {{._PY_FMT_CMD}} {{._PY_SRC}}
      - printf '%s\n' "{{._PY_OK}} {{._PY_NAME}} · py · formatted"

  typecheck:
    desc: "mypy (skipped when mypy is not a project dependency)"
    deps: [install]
    status:
      - "! poetry run python -c 'import {{._PY_TC_MOD}}' >/dev/null 2>&1"
    cmds:
      - printf '%s\n' "{{._PY_RUN}} {{._PY_NAME}} · py · {{._PY_TC_CMD}}"
      - poetry run {{._PY_TC_CMD}} {{._PY_SRC}}
      - printf '%s\n' "{{._PY_OK}} {{._PY_NAME}} · py · types clean"

  lock:
    desc: "Regenerate poetry.lock"
    cmds:
      - poetry env use {{._PY_BIN}} >/dev/null
      - poetry lock {{._PY_LOCK_FLAGS}}
      - printf '%s\n' "{{._PY_OK}} {{._PY_NAME}} · py · poetry.lock regenerated"

  deps:update:
    desc: "Bump dependencies within their pyproject constraints, then refresh the lock"
    # Stays inside the caret/tilde ranges already written in pyproject.toml.
    # Widening those is deps:update:latest.
    cmds:
      - printf '%s\n' "{{._PY_RUN}} {{._PY_NAME}} · py · poetry update"
      - poetry update --no-interaction {{._PY_UPDATE_FLAGS}}
      - printf '%s\n' "{{._PY_OK}} {{._PY_NAME}} · py · deps bumped — review poetry.lock, then lint + test"

  deps:update:latest:
    desc: "Widen constraints and bump everything, majors included"
    # Deliberately separate: majors carry breaking changes and usually need
    # code edits to clear deprecations.
    cmds:
      # Idempotent — `poetry self add` on an installed plugin is a no-op.
      - poetry self add poetry-plugin-up >/dev/null
      - printf '%s\n' "{{._PY_RUN}} {{._PY_NAME}} · py · poetry up --latest (majors included)"
      - poetry up --latest
      - printf '%s\n' "{{._PY_OK}} {{._PY_NAME}} · py · review pyproject.toml + poetry.lock, then lint + test"

  deps:outdated:
    desc: "Show dependencies with a newer version available (read-only)"
    # Unlike `pnpm outdated`, `poetry show --outdated` does not exit non-zero
    # just for finding something outdated — it exits 0 either way and only
    # fails for a real reason (no poetry.lock, an unresolvable dependency),
    # so nothing here should swallow that.
    cmds:
      - poetry show --outdated
