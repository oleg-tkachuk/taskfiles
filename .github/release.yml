# Shapes the notes GitHub generates for a release — `release.yml` in the
# workflows directory calls `gh release create --generate-notes`, and this is
# the file that decides what those notes contain.
#
# It is the mechanical half. The curated half lives in CHANGELOG.md and says
# what an upgrading consumer has to *do*; this half says what landed and who
# landed it. Neither replaces the other, and the release gate refuses a tag
# that has no changelog entry precisely because generated notes cannot answer
# that question.
#
# Categories match on pull-request labels, so a change merged without one
# falls through to "Other Changes" rather than disappearing.
changelog:
  exclude:
    labels:
      - automated # e.g. "📚 Automated Documentation Update" PRs
      - duplicate
      - invalid
      - wontfix
      - question
    authors:
      # Action bumps keep CI current; they change nothing a consumer of the
      # modules can observe, so they are noise in a release note.
      - dependabot[bot]
      - github-actions[bot]
  categories:
    - title: 🚀 Features
      labels:
        - enhancement
    - title: 🐛 Bug Fixes
      labels:
        - bug
    - title: 📚 Documentation
      labels:
        - documentation
    - title: Other Changes
      labels:
        - "*"
