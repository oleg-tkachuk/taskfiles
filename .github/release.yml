# Shapes the notes GitHub generates for a release — the `publish` job in
# `.github/workflows/ci.yml` calls `gh release create --generate-notes`, and
# this is the file that decides what those notes contain.
#
# It is the mechanical half: what landed and who landed it. What an upgrading
# consumer has to *do* is the other half, and generated notes cannot answer
# that — so .github/ci/publish-release.ts puts it above them, copied from the
# "Consumer impact" section of each merged pull request.
#
# Categories match on pull-request labels. publish-release.ts labels each
# pull request from its commits before these notes are written, so a change
# merged without a label is still sorted; "Other Changes" is what releases
# nothing — CI, refactors, tests. lib/release-notes.test.ts holds the labels
# it adds to the categories below.
changelog:
  exclude:
    labels:
      - automated # e.g. "📚 Automated Documentation Update" PRs
      - duplicate
      - invalid
      - wontfix
      - question
      # Renovate labels every pull request it opens. None of them changes
      # anything a consumer of the modules can observe, so they are noise in a
      # release note. By label, not author: Renovate acts with a personal
      # access token, so its pull requests are authored by the token owner.
      - dependencies
    authors:
      - github-actions[bot]
  categories:
    # First, and a pull request appears once, in the first category that
    # matches: whatever else a breaking change is, this is where it is read.
    - title: ⚠️ Breaking Changes
      labels:
        - breaking
    - title: 🚀 Features
      labels:
        - enhancement
    - title: 🐛 Bug Fixes
      labels:
        - bug
    - title: 📚 Documentation
      labels:
        - documentation
    - title: Other Changes
      labels:
        - "*"
