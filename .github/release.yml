# Shapes the notes GitHub generates for a release — the `publish` job in
# `.github/workflows/ci.yml` calls `gh release create --generate-notes`, and
# this is the file that decides what those notes contain.
#
# It is the mechanical half. The curated half lives in CHANGELOG.md and says
# what an upgrading consumer has to *do*; this half says what landed and who
# landed it. Neither replaces the other, and the release gate refuses a tag
# that has no changelog entry precisely because generated notes cannot answer
# that question.
#
# Categories match on pull-request labels, so a change merged without one
# falls through to "Other Changes" rather than disappearing.
changelog:
  exclude:
    labels:
      - automated # e.g. "📚 Automated Documentation Update" PRs
      - duplicate
      - invalid
      - wontfix
      - question
      # Renovate labels every pull request it opens. None of them changes
      # anything a consumer of the modules can observe, so they are noise in a
      # release note. By label, not author: Renovate acts with a personal
      # access token, so its pull requests are authored by the token owner.
      - dependencies
    authors:
      - github-actions[bot]
  categories:
    - title: 🚀 Features
      labels:
        - enhancement
    - title: 🐛 Bug Fixes
      labels:
        - bug
    - title: 📚 Documentation
      labels:
        - documentation
    - title: Other Changes
      labels:
        - "*"
