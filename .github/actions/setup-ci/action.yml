name: Set up the CI scripts
description: >-
  Node at the version .github/ci/.node-version pins, and the CI scripts'
  dependencies from their lockfile with no install script run, so a step can
  run `node .github/ci/<command>.ts`.

inputs:
  path:
    description: Where the repository is checked out, relative to the workspace.
    required: false
    default: "."

runs:
  using: composite
  steps:
    # One pin for every workflow, exact so a patch arrives as a reviewed
    # change rather than whatever the runner image caches. 24 is also the last
    # line that ships corepack, which the pnpm smoke checks drive. No
    # dependency cache: a job here may hold a write token, and a cache
    # another run wrote is not something to restore into it.
    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: ${{ inputs.path }}/.github/ci/.node-version
        package-manager-cache: false

    # Bounded in time and tried again — see .github/ci/install.ts. The path
    # arrives through env, never as an expression inside the script.
    - name: Install the CI scripts' dependencies
      shell: bash
      env:
        CHECKOUT: ${{ inputs.path }}
      run: node "$CHECKOUT/.github/ci/install.ts" "$CHECKOUT/.github/ci"
