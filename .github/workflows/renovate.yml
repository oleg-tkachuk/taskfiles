# Renovate runs here, in this repository's own Actions, rather than as the
# hosted GitHub App. The whole configuration — cadence included — is then in
# this repository and reviewable in a diff, and it can see what Dependabot
# could not: TASK_VERSION in ci.yml and the zizmor pin shared by ci.yml and
# lefthook.yml. .github/renovate.json is the configuration; this file only
# decides when Renovate runs and as whom.
name: Renovate

on:
  # The first pass, and any pass on demand.
  workflow_dispatch:
    inputs:
      ignoreSchedule:
        description: "Ignore renovate.json's schedule and act now"
        type: boolean
        default: true
      dryRun:
        description: "Log what would happen and open nothing"
        type: boolean
        default: false
      logLevel:
        description: "Renovate log level"
        type: choice
        options: [info, debug]
        default: info

  # A ticked checkbox on the Dependency Dashboard only records a request;
  # Renovate fulfils it on its next run. This makes that run now rather than
  # tomorrow. Renovate's own rewrite of the dashboard fires this too — the
  # `tick` step below is what stops that from looping.
  issues:
    types: [edited]

  # How often Renovate runs, not what it may do: renovate.json's schedule
  # holds updates for Monday. Daily because GitHub runs scheduled workflows
  # best-effort and late; a weekly cron that slips is a week without updates.
  schedule:
    - cron: "0 6 * * *"

# Renovate acts with RENOVATE_TOKEN; GITHUB_TOKEN only checks out the scripts.
permissions:
  contents: read

concurrency:
  group: renovate
  # A pass killed between creating a branch and opening its pull request
  # leaves the branch for the next one to reconcile.
  cancel-in-progress: false

jobs:
  renovate:
    name: Dependency updates
    # From an issue event, only Renovate's own dashboard. The repository is
    # public: anyone can open an issue titled `Dependency Dashboard`. Renovate
    # opens the real one with RENOVATE_TOKEN, a personal access token, so its
    # author is the token's owner — the repository owner — not renovate[bot].
    if: >-
      github.event_name != 'issues' || (
        github.event.issue.title == 'Dependency Dashboard' &&
        github.event.issue.user.login == github.repository_owner
      )
    # The token is an environment secret, not a repository one, so this job is
    # the only thing that can read it — and the environment can be limited to
    # main, which every trigger above runs on.
    environment: renovate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 'Setup: check out the repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 'Setup: the CI scripts'
        uses: ./.github/actions/setup-ci

      - name: 'Decide: a dashboard checkbox was newly ticked'
        id: tick
        if: github.event_name == 'issues'
        # Issue text reaches the shell through the environment, never through
        # an expression in the script.
        env:
          BODY_BEFORE: ${{ github.event.changes.body.from }}
          BODY_AFTER: ${{ github.event.issue.body }}
        run: node .github/ci/renovate-tick.ts

      - name: 'Guard: RENOVATE_TOKEN is set'
        if: github.event_name != 'issues' || steps.tick.outputs.proceed == 'true'
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: node .github/ci/renovate-require-token.ts

      - name: 'Run: Renovate'
        if: github.event_name != 'issues' || steps.tick.outputs.proceed == 'true'
        uses: renovatebot/github-action@2804199d260ad00c1fae0e9e842888369391c776 # v46.3.10
        env:
          # renovate.json has no postUpgradeTasks: npm regenerates its own
          # lockfile and nothing else here is derived from a pin. A command
          # added there has to be added here as an anchored regex, or Renovate
          # skips it with a warning; scripts/check-renovate.sh holds the two
          # together.
          RENOVATE_ALLOWED_COMMANDS: '[]'
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM: github
          # The commit author string only. Pull requests and the dashboard are
          # authored by the token's owner.
          RENOVATE_GIT_AUTHOR: "renovate[bot] <29139614+renovate[bot]@users.noreply.github.com>"
          # Release notes in pull request bodies come from github.com.
          GITHUB_COM_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_DRY_RUN: ${{ inputs.dryRun && 'full' || '' }}
          # A manual run means now. Without this, dispatching on a Thursday
          # does nothing and looks broken.
          RENOVATE_FORCE: ${{ (github.event_name == 'workflow_dispatch' && inputs.ignoreSchedule) && '{"schedule":null}' || '' }}
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
