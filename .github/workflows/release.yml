# Cutting a tag is the only thing consumers actually see: they pin
# `?ref=vX.Y.Z`, so a tag is a promise that this exact tree can be included and
# works. This workflow checks that promise before publishing the release, and
# it checks it the way a consumer would — over the network, through the git
# include path, not from a local checkout.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to verify and release"
        required: true

permissions:
  contents: read

concurrency:
  # One release at a time for a given tag. Not cancel-in-progress: a publish
  # killed halfway is worse than a second run that finds the release already
  # created and says so.
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Remote Taskfiles are only stable from 3.53; keep this in step with ci.yml.
  TASK_VERSION: 3.53.1

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes with the checkout credential, so it has no
          # reason to be left behind in .git/config.
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint
        run: task lint

      - name: Refuse a tag with no changelog entry
        # The notes on the Releases page are generated from commits; this is
        # the curated half, and the only place an upgrading consumer is told
        # which names changed and what to set instead. A tag published without
        # it is a tag nobody can act on.
        #
        # The tag arrives through env, never through `${{ }}` inside the script:
        # an expression is substituted as text before bash parses the line, so a
        # tag named `v1.0.0$(…)` — git allows that — would run as a command.
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$TAG"
          version="${tag#v}"
          if [ ! -f CHANGELOG.md ]; then
            echo "✖ $tag has no CHANGELOG.md in its tree" >&2
            echo "  Tags cut before the changelog existed cannot pass this gate," >&2
            echo "  and do not need to: release from a tag that contains it." >&2
            exit 1
          fi
          if ! grep -qF "## [$version]" CHANGELOG.md; then
            echo "✖ CHANGELOG.md has no '## [$version]' section" >&2
            echo "  Add one — what a consumer has to do about this release —" >&2
            echo "  and move anything under [Unreleased] into it." >&2
            exit 1
          fi
          echo "✔ $tag is documented in CHANGELOG.md"

      - name: Refuse a tag that is not SemVer
        # Helm and OCI both reject a chart version that is not SemVer-2, and
        # the modules mint chart versions from these tags. A tag that cannot be
        # a chart version is a tag no consumer can use.
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$TAG"
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) echo "✔ $tag is SemVer-shaped" ;;
            *) echo "✖ $tag is not vMAJOR.MINOR.PATCH" >&2; exit 1 ;;
          esac

  consumable:
    name: consumable over git
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Let git fetch this repository over HTTPS
        # Task shells out to the system git for a remote include, so the token
        # goes in through git's own config rather than into the Taskfile — and
        # through env rather than `${{ }}`, so it is never substituted into the
        # rendered script.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Include the tag the way a consumer does
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        # Deliberately NOT a local checkout: this is the only step that proves
        # the published tag can be fetched, that every module resolves through
        # the git include path, and that the trust prompt does not block CI.
        run: |
          set -euo pipefail
          mkdir consumer && cd consumer
          git init -q
          git config user.email ci@example.invalid
          git config user.name CI
          echo placeholder > README.md
          git add -A && git commit -qm "chore: seed"

          cat > Taskfile.yaml <<'YAML'
          version: "3"
          silent: true
          vars:
            TASKLIB: 'https://github.com/OWNER_REPO.git//'
            TASKLIB_TAG: 'TAGVALUE'
            PROJECT_NAME: smoke
            IMAGE_NAMESPACE: acme
            K8S_NAMESPACE: smoke-ns
            REGISTRY: registry.example
            VERSION_BASE: 9.9.9
          includes:
            release: { taskfile: '{{.TASKLIB}}release?ref={{.TASKLIB_TAG}}', dir: . }
            k8s:     { taskfile: '{{.TASKLIB}}k8s?ref={{.TASKLIB_TAG}}', dir: . }
            go:      { taskfile: '{{.TASKLIB}}go?ref={{.TASKLIB_TAG}}', dir: . }
            py:      { taskfile: '{{.TASKLIB}}python?ref={{.TASKLIB_TAG}}', dir: . }
            node:    { taskfile: '{{.TASKLIB}}node?ref={{.TASKLIB_TAG}}', dir: . }
            dev:     { taskfile: '{{.TASKLIB}}compose?ref={{.TASKLIB_TAG}}', dir: . }
            sec:     { taskfile: '{{.TASKLIB}}security?ref={{.TASKLIB_TAG}}', dir: . }
            all:     { taskfile: '{{.TASKLIB}}monorepo?ref={{.TASKLIB_TAG}}', dir: . }
            argocd:  { taskfile: '{{.TASKLIB}}argocd?ref={{.TASKLIB_TAG}}', dir: . }
            auth:    { taskfile: '{{.TASKLIB}}auth?ref={{.TASKLIB_TAG}}', dir: . }
            local:   { taskfile: '{{.TASKLIB}}runtime/orbstack?ref={{.TASKLIB_TAG}}', dir: . }
          tasks: {}
          YAML
          # python rather than sed: the substitution is literal, so a tag
          # carrying a `|`, a `&` or a backslash cannot rewrite the expression
          # or leak into the shell.
          python3 - "$REPO" "$TAG" <<'SUBST'
          import sys, pathlib
          p = pathlib.Path("Taskfile.yaml")
          p.write_text(p.read_text().replace("OWNER_REPO", sys.argv[1]).replace("TAGVALUE", sys.argv[2]))
          SUBST

          # --yes accepts the first-fetch trust prompt; unattended, that prompt
          # is a hang rather than a question.
          task --yes --list-all > /dev/null
          version=$(task --yes release:version)
          case "$version" in
            9.9.9-dev.*) echo "✔ the published tag includes and resolves ($version)" ;;
            *) echo "✖ expected a 9.9.9 base, got $version" >&2; exit 1 ;;
          esac

  publish:
    name: publish
    needs: [gate, consumable]
    runs-on: ubuntu-latest
    permissions:
      # The only job in either workflow that needs more than read, which is why
      # the elevation sits here rather than at the top of the file.
      contents: write # `gh release create` writes the release and its notes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes with the checkout credential, so it has no
          # reason to be left behind in .git/config.
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        # Notes come from the commits since the previous tag, which is why the
        # commit messages are written the way they are.
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "✔ release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
          echo "✔ released $TAG"
