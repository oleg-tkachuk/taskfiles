name: Release

# Dispatched by CI once every check on a push to main has passed — see the
# `release` job in ci.yml.
#
# workflow_run is the obvious trigger and is not available here: zizmor's
# dangerous-triggers audit refuses it categorically, and its own docs say no
# guard satisfies it — "checking github.repository is not effective on
# workflow_run, since a workflow_run always runs in the context of the target
# repository." Silencing a high finding to get this file its own row in the
# Actions tab is not a trade this repository makes.
#
# repository_dispatch avoids that without extra cost. GitHub does not start
# new workflow runs from events triggered by GITHUB_TOKEN — which is why
# pushing a tag from CI cannot chain a workflow on its own, and why the usual
# workaround is a long-lived PAT — and repository_dispatch is one of the two
# documented exceptions that always create a run. So CI dispatches this with
# its own GITHUB_TOKEN: no extra credential, no dangerous trigger.
#
# Deliberately no workflow_dispatch: it would let a maintainer cut a release
# from an untested main with one click, which is exactly the gate below
# exists to prevent.
on:
  repository_dispatch:
    types: [release]

# Nothing at the top level — the job below asks for exactly what it needs,
# and nothing narrows an inherited grant since there is no caller above it.
permissions: {}

concurrency:
  # Two dispatches close together would both compute "next version" from the
  # same last tag and could push conflicting ones — one queue, not per-ref,
  # since a repository_dispatch payload carries no ref to key on. Never
  # cancel-in-progress: a semantic-release run killed mid-push can leave a
  # tag pushed without the release it was for, same reasoning as ci.yml's own
  # concurrency group for a tag push.
  group: release
  cancel-in-progress: false

jobs:
  semantic-release:
    name: Compute and push the next tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # semantic-release only creates and pushes the tag — see release.config.cjs
      actions: write # dispatches ci.yml for the tag it pushed — see the last step
    steps:
      # No persist-credentials: false here — semantic-release pushes the tag
      # it creates, so this is the one checkout in the repository that
      # genuinely needs its credentials.
      #
      # Deliberately no `ref:`. A repository_dispatch run checks out the head
      # of the default branch, which is a BRANCH — and semantic-release has
      # to be on one of its configured release branches to release at all.
      # Checking out the dispatched sha instead would leave a detached HEAD,
      # where semantic-release finds no release branch and does nothing. The
      # sha is printed below instead, which is what it was wanted for.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          # semantic-release derives the next version from the commit history.
          fetch-depth: 0

      # Which commit and which CI run asked for this release. A dispatched
      # run is not linked to its trigger in the UI the way a workflow_run is,
      # so without this line the run says nothing about where it came from.
      - name: Say what dispatched this
        env:
          SHA: ${{ github.event.client_payload.sha }}
          CI_RUN: ${{ github.event.client_payload.ci_run_id }}
        run: |
          printf 'dispatched by CI run %s for commit %s\n' "${CI_RUN:-unknown}" "${SHA:-unknown}"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # package.json/package-lock.json already pin semantic-release and its
      # conventionalcommits preset, so this installs the exact versions
      # committed to the repository rather than trusting a marketplace
      # action's own bundled pin.
      - run: npm ci

      - run: npx semantic-release --no-ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The second hop, and it was missing.
      #
      # The note at the top of this file explains that GitHub starts no
      # workflow run from an event GITHUB_TOKEN caused, and uses
      # repository_dispatch to get HERE. The same rule applies to what comes
      # after: ci.yml publishes a release on `push: tags`, semantic-release
      # pushes the tag with that same token, so the push arrives and starts
      # nothing. The tag then exists with no GitHub release behind it — which
      # is exactly what happened to v6.0.0, tagged and unreleased until it was
      # dispatched by hand.
      #
      # Automating the tag removed the very thing that used to trigger the
      # publish: v5.3.0 and v5.4.0 were pushed by a person, and a person's
      # push does start a run.
      #
      # workflow_dispatch is the other documented exception that always creates
      # a run, and ci.yml already takes a `tag` input for exactly this — so
      # this needs no new credential and keeps the gate: ci.yml still verifies
      # the tag is consumable over git before it publishes anything.
      - name: Release the tag it just pushed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Read from git rather than parsing semantic-release's prose:
          # it tags the commit that was checked out, so no new tag here means
          # no release was due and there is nothing to publish.
          tag="$(git tag --points-at HEAD | head -1)"

          if [ -z "$tag" ]; then
            printf '%s\n' "no new tag on this commit — no release was due"
            exit 0
          fi

          printf '%s\n' "dispatching ci.yml to verify and publish $tag"
          gh workflow run ci.yml -f tag="$tag"
