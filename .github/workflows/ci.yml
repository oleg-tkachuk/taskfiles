# The same gate the git hooks run, on a machine that has never seen this repo.
#
# Everything here is `task lint` — the checks live in Taskfile.yaml so the hook
# and the workflow cannot drift apart. What CI adds is a clean environment: a
# module that only parses because of something left in a developer's checkout
# fails here.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push supersedes the run in flight for the same ref; nothing here is
  # worth finishing twice.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned, not floating: remote Taskfiles are only stable from 3.53, and a
  # silent upgrade under CI is how a green gate stops meaning what it meant.
  #
  # Deliberately NOT the official taskfile/task image: Docker Hub last
  # published it in 2024-10 at v3.39.2, amd64 only, so it would test an older
  # Task than anyone runs and would never see a regression in anything added
  # since. (It is also Alpine with neither git nor Node, so it cannot serve as
  # a job `container:` — actions/checkout needs both.) Revisit if upstream
  # starts publishing again.
  TASK_VERSION: 3.53.1

jobs:
  workflows:
    # The workflows are the one part of this repository that runs with a token.
    # zizmor is the linter for that: it catches an expression interpolated into
    # a shell script, a checkout that leaves its credential behind, an action
    # pinned to a mutable tag. Two of those had already shipped here.
    name: Workflow audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 'Setup: check out the repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 'Guard: the workflows pass the auditor'
        # pipx rather than uvx: pipx ships on the runner image, uv does not.
        # Pinned like everything else, and --persona=auditor so this is the
        # strict run rather than the default one.
        run: pipx run zizmor==1.30.0 --persona=auditor --format=plain .github/workflows/

  lint:
    name: Lint
    strategy:
      # Both, always: a divergence between BSD and GNU userland is exactly the
      # kind of thing one green check would hide, and knowing which of the two
      # broke is the whole value of running both.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: 'Setup: check out the repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes with the checkout credential, so it has no
          # reason to be left behind in .git/config.
          persist-credentials: false
          # The modules resolve git state for their version scheme; the tags
          # are what make that resolution realistic rather than a fallback.
          fetch-depth: 0

      - name: 'Setup: Task'
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Notice: a newer Task exists'
        # Dependabot watches `uses:` pins and cannot see TASK_VERSION, so this
        # is the only thing that would ever mention a new Task. A notice rather
        # than a gate: the pin is deliberate — a silent upgrade is how a green
        # check stops meaning what it meant — so this reports and moves on.
        #
        # continue-on-error keeps a rate-limited API call from failing the job.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PINNED: ${{ env.TASK_VERSION }}
        run: |
          set -euo pipefail
          latest=$(gh release view --repo go-task/task --json tagName --jq '.tagName' | sed 's/^v//')
          if [ "$latest" != "$PINNED" ]; then
            echo "::notice::Task $latest is out; this repository pins $PINNED. Bump TASK_VERSION in both workflows after reading the changelog."
          else
            echo "✔ TASK_VERSION $PINNED is the current release"
          fi

      - name: 'Guard: every module lints'
        run: task lint

  consumer-smoke:
    # A consumer is the only thing that exercises the modules the way they are
    # actually used — included, with the consumer's vars overriding the
    # defaults. This builds a throwaway one rather than depending on any other
    # repository being present.
    name: Consumer smoke
    strategy:
      # Both, always: a divergence between BSD and GNU userland is exactly the
      # kind of thing one green check would hide, and knowing which of the two
      # broke is the whole value of running both.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: 'Setup: check out the repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes with the checkout credential, so it has no
          # reason to be left behind in .git/config.
          persist-credentials: false
          path: taskfiles

      - name: 'Setup: Task'
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Setup: Go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          # The fixture has no dependencies, so a module cache saves nothing —
          # and this workflow runs on tag pushes, where a writable cache is a
          # path from a pull request into a release build.
          cache: false

      - name: 'Setup: a consumer that includes the library'
        run: |
          set -euo pipefail
          mkdir -p consumer && cd consumer
          git init -q
          git config user.email ci@example.invalid
          git config user.name CI
          echo placeholder > README.md
          git add -A && git commit -qm "chore: seed"

          cat > Taskfile.yaml <<'YAML'
          version: "3"
          silent: true
          vars:
            TASKLIB: '../taskfiles/%s'
            PROJECT_NAME: smoke
            IMAGE_NAMESPACE: acme
            K8S_NAMESPACE: smoke-ns
            REGISTRY: registry.example.com
            VERSION_BASE: 9.9.9
          includes:
            release:        { taskfile: '{{printf .TASKLIB "release"}}', dir: . }
            k8s:            { taskfile: '{{printf .TASKLIB "k8s"}}', dir: . }
            go:             { taskfile: '{{printf .TASKLIB "go"}}', dir: . }
            python:         { taskfile: '{{printf .TASKLIB "python/poetry"}}', dir: . }
            pythonuv:       { taskfile: '{{printf .TASKLIB "python/uv"}}', dir: . }
            node:           { taskfile: '{{printf .TASKLIB "node"}}', dir: . }
            pnpm:           { taskfile: '{{printf .TASKLIB "pnpm"}}', dir: . }
            compose:        { taskfile: '{{printf .TASKLIB "compose"}}', dir: . }
            security:       { taskfile: '{{printf .TASKLIB "security"}}', dir: . }
            checkov:        { taskfile: '{{printf .TASKLIB "checkov"}}', dir: . }
            monorepo:       { taskfile: '{{printf .TASKLIB "monorepo"}}', dir: . }
            argocd:         { taskfile: '{{printf .TASKLIB "argocd"}}', dir: . }
            auth:           { taskfile: '{{printf .TASKLIB "auth"}}', dir: . }
            codegen:        { taskfile: '{{printf .TASKLIB "codegen"}}', dir: . }
            cosign:         { taskfile: '{{printf .TASKLIB "cosign"}}', dir: . }
            helm:           { taskfile: '{{printf .TASKLIB "helm"}}', dir: . }
            sealedsecrets:  { taskfile: '{{printf .TASKLIB "sealed-secrets"}}', dir: . }
            local:          { taskfile: '{{printf .TASKLIB "runtime/orbstack"}}', dir: . }
            localdocker:    { taskfile: '{{printf .TASKLIB "runtime/docker"}}', dir: . }
            localk3d:       { taskfile: '{{printf .TASKLIB "runtime/k3d"}}', dir: . }
            localkind:      { taskfile: '{{printf .TASKLIB "runtime/kind"}}', dir: . }
            localminikube:  { taskfile: '{{printf .TASKLIB "runtime/minikube"}}', dir: . }
          tasks: {}
          YAML

          # A module, so the tasks that compile and generate have something to
          # act on. Loading a module proves it parses; running one is the only
          # thing that proves it works, and the two bugs this job exists to
          # catch — a generator whose output is never normalised, a paired skip
          # that reports the wrong branch — both parse cleanly.
          cat > go.mod <<'GOMOD'
          module example.com/smoke

          go 1.21
          GOMOD

          cat > smoke.go <<'GOFILE'
          package smoke

          //go:generate sh -c "printf 'package smoke\n\nconst Generated = true\n' > generated.go"

          // Greeting is what the fixture's test asserts on.
          func Greeting() string { return "hi" }
          GOFILE

          cat > smoke_test.go <<'GOTEST'
          package smoke

          import "testing"

          func TestGreeting(t *testing.T) {
            if Greeting() != "hi" {
              t.Fatal("unexpected greeting")
            }
          }
          GOTEST

          git add -A && git commit -qm "chore: fixture"

      - name: 'Verify: every module loads side by side'
        working-directory: consumer
        # This is the check that catches a module quietly claiming a name
        # another module already uses.
        run: task --list-all > /dev/null

      - name: 'Verify: cosign no-ops cleanly with no key and no binary'
        working-directory: consumer
        # cosign is the one module that reads another module's derived vars
        # (_REL_VERSION, _REL_IMAGE) rather than its own — the most likely
        # place for the var-namespace scoping the whole library depends on to
        # break quietly. COSIGN_SIGN=0 exercises every task's status guard
        # without needing cosign or syft installed, which a real sign/attest
        # run would.
        run: |
          set -euo pipefail
          COSIGN_SIGN=0 task cosign:all cosign:verify
          echo "✔ cosign no-ops without a key, syft or the cosign binary"

      - name: 'Verify: helm no-ops cleanly with no cluster'
        working-directory: consumer
        # helm:list's own status guard skips it when kubectl cannot reach a
        # cluster, which is always true here — this proves that guard, not the
        # Helm listing itself.
        run: |
          set -euo pipefail
          task helm:list
          echo "✔ helm:list no-ops without a reachable cluster"

      - name: 'Verify: codegen actually generates'
        working-directory: consumer
        # `go generate` is the one step of the chain that needs no external
        # tool, so it is the one the library can prove end to end. It also
        # exercises the module's GOWORK=off, which is what made generation fail
        # for a real consumer before it was set.
        run: |
          set -euo pipefail
          test ! -f generated.go
          task codegen:generate
          test -f generated.go
          grep -q 'const Generated = true' generated.go
          echo "✔ codegen:generate wrote the file its directive asks for"

      - name: 'Verify: the go module compiles, tests and builds'
        working-directory: consumer
        # Four tasks that do work rather than report it. `build` is left out
        # deliberately: GO_MAIN defaults to ./cmd/..., which this fixture does
        # not have, and a package with no main is the shape most consumers of
        # the other three tasks actually are.
        run: |
          set -euo pipefail
          task go:fmt
          task go:compile
          task go:test
          task go:tidy
          echo "✔ the go module's tasks run against a real module"

      - name: "Verify: the consumer's vars reach the modules"
        working-directory: consumer
        # The scoping rule the whole library is built around: a var declared in
        # a module would shadow this. VERSION_BASE is the cheapest observable
        # proof that it does not.
        run: |
          set -euo pipefail
          version=$(task release:version)
          case "$version" in
            9.9.9-dev.*) echo "✔ consumer vars reach the modules ($version)" ;;
            *) echo "✖ expected a 9.9.9 base, got $version" >&2; exit 1 ;;
          esac
