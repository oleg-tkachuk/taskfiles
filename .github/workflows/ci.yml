# The same gate the git hooks run, on a machine that has never seen this repo.
#
# Everything here is `task lint` — the checks live in Taskfile.yaml so the hook
# and the workflow cannot drift apart. What CI adds is a clean environment: a
# module that only parses because of something left in a developer's checkout
# fails here.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push supersedes the run in flight for the same ref; nothing here is
  # worth finishing twice.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The official Task image, pinned. Bumping is this one line.
  #
  # It is used through `docker run` rather than as a job-level `container:`,
  # because the image is Alpine with neither git nor Node: a container job
  # cannot run actions/checkout (a JS action needing Node, and git to clone).
  # The host does the checkout, the image does the Task.
  #
  # NOTE: hub.docker.com/r/taskfile/task last published v3.39.2 (2024-10),
  # while Task itself is at 3.53.x. The library needs 3.53+ only for the
  # remote-include path, which CI does not exercise — everything here loads
  # from a local path — so the gate is sound on this image. It does mean CI
  # runs an older Task than developers do; when upstream publishes again,
  # bump this tag deliberately.
  TASK_IMAGE: taskfile/task:v3.39.2-amd64

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The modules resolve git state for their version scheme; the tags
          # are what make that resolution realistic rather than a fallback.
          fetch-depth: 0

      - name: Lint
        # The image's entrypoint is `task`, so the argument is the task name.
        run: docker run --rm -v "$PWD":/w -w /w "$TASK_IMAGE" lint

  consumer-smoke:
    # A consumer is the only thing that exercises the modules the way they are
    # actually used — included, with the consumer's vars overriding the
    # defaults. This builds a throwaway one rather than depending on any other
    # repository being present.
    name: consumer smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: taskfiles

      - name: Build a consumer against the library
        # The consumer's git repo is created on the host, which has git; the
        # image only runs Task against it.
        run: |
          set -euo pipefail
          mkdir -p consumer && cd consumer
          git init -q
          git config user.email ci@example.invalid
          git config user.name CI
          echo placeholder > README.md
          git add -A && git commit -qm "chore: seed"

          cat > Taskfile.yaml <<'YAML'
          version: "3"
          silent: true
          vars:
            TASKLIB: ../taskfiles
            TASKLIB_REF: ""
            PROJECT_NAME: smoke
            IMAGE_NAMESPACE: acme
            K8S_NAMESPACE: smoke-ns
            REGISTRY: registry.example
            VERSION_BASE: 9.9.9
          includes:
            svc:  { taskfile: '{{.TASKLIB}}/service.yaml{{.TASKLIB_REF}}', dir: . }
            go:   { taskfile: '{{.TASKLIB}}/go.yaml{{.TASKLIB_REF}}', dir: . }
            py:   { taskfile: '{{.TASKLIB}}/python.yaml{{.TASKLIB_REF}}', dir: . }
            node: { taskfile: '{{.TASKLIB}}/node.yaml{{.TASKLIB_REF}}', dir: . }
            dev:  { taskfile: '{{.TASKLIB}}/compose.yaml{{.TASKLIB_REF}}', dir: . }
            sec:  { taskfile: '{{.TASKLIB}}/security.yaml{{.TASKLIB_REF}}', dir: . }
            all:  { taskfile: '{{.TASKLIB}}/monorepo.yaml{{.TASKLIB_REF}}', dir: . }
            argocd: { taskfile: '{{.TASKLIB}}/argocd.yaml{{.TASKLIB_REF}}', dir: . }
            auth: { taskfile: '{{.TASKLIB}}/auth.yaml{{.TASKLIB_REF}}', dir: . }
          tasks: {}
          YAML

      - name: Load every module side by side
        working-directory: consumer
        # This is the check that catches a module quietly claiming a name
        # another module already uses.
        run: docker run --rm -v "$PWD/..":/w -w /w/consumer "$TASK_IMAGE" --list-all > /dev/null

      - name: Prove the consumer's vars reach the modules
        working-directory: consumer
        # The scoping rule the whole library is built around: a var declared in
        # a module would shadow this. VERSION_BASE is the cheapest observable
        # proof that it does not. git is installed into the image for this step
        # so the version derivation runs for real rather than on its fallbacks.
        run: |
          set -euo pipefail
          version=$(docker run --rm -v "$PWD/..":/w -w /w/consumer --entrypoint sh "$TASK_IMAGE" -c '
            apk add --no-cache git >/dev/null 2>&1
            git config --global --add safe.directory /w/consumer
            task svc:version
          ')
          case "$version" in
            9.9.9-dev.*) echo "✔ consumer vars reach the modules ($version)" ;;
            *) echo "✖ expected a 9.9.9 base, got $version" >&2; exit 1 ;;
          esac
