# The same gate the git hooks run, on a machine that has never seen this
# repo — and, on a tag, the release gate too. `gate`, `consumable` and
# `publish` below `needs:` the checks above them, so a tag whose own CI run
# is red cannot reach `gh release create`.
#
# These used to be two workflows, both triggered by the same tag push,
# running in parallel with no dependency between them. Elsewhere, that exact
# split let a release ship while its sibling CI run was still red — a job
# dependency in one workflow closes the gap a second, independent trigger
# cannot.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to verify and release (leave empty for a plain CI run)"
        required: false

permissions:
  contents: read

concurrency:
  # A new push supersedes the run in flight for the same ref — except a
  # release verification: a release publish killed halfway is worse than a
  # second run that finds the release already there and says so.
  #
  # The release path arrives as workflow_dispatch with `inputs.tag` set, not
  # as a tag push — GITHUB_TOKEN cannot start a run from the tag push
  # semantic-release makes, which is why release.yml calls back in with
  # `-f tag=`. On workflow_dispatch, github.ref is the branch the run was
  # dispatched against (main here, since nothing passes --ref), not the tag —
  # so keying and guarding on github.ref alone put every release verification
  # in the same group as ordinary main pushes and left it cancelable by the
  # next one. inputs.tag is what actually marks the run as a release.
  group: ci-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && inputs.tag == '' }}

env:
  # Pinned, not floating: remote Taskfiles are only stable from 3.53, and a
  # silent upgrade under CI is how a green gate stops meaning what it meant.
  #
  # Deliberately NOT the official taskfile/task image: Docker Hub last
  # published it in 2024-10 at v3.39.2, amd64 only, so it would test an older
  # Task than anyone runs and would never see a regression in anything added
  # since. (It is also Alpine with neither git nor Node, so it cannot serve as
  # a job `container:` — actions/checkout needs both.) Revisit if upstream
  # starts publishing again.
  # renovate: datasource=github-releases depName=go-task/task extractVersion=^v(?<version>.*)$
  TASK_VERSION: 3.54.0
  # What every checkout below resolves: the dispatched tag when there is one,
  # otherwise whatever triggered this run. workflow_dispatch's own
  # `github.ref` stays the branch picked in the "Run workflow" UI even when
  # `tag` is set, so `inputs.tag` has to win explicitly.
  CHECKOUT_REF: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

jobs:
  workflows:
    # The workflows are the one part of this repository that runs with a token.
    # zizmor is the linter for that: it catches an expression interpolated into
    # a shell script, a checkout that leaves its credential behind, an action
    # pinned to a mutable tag. Two of those had already shipped here.
    name: Workflow audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 'Setup: check out the repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.CHECKOUT_REF }}

      - name: 'Setup: install uv'
        # The runner image ships no uv; zizmor runs through uvx below.
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: 'Guard: the workflows pass the auditor'
        # Pinned like everything else, and --persona=auditor so this is the
        # strict run rather than the default one.
        # renovate: datasource=pypi depName=zizmor
        run: uvx zizmor@1.31.1 --persona=auditor --format=plain .github/workflows/ .github/actions/

  # Feeds consumer-smoke's `if:` below. That job proves the Task modules work
  # for a real consumer; it never reads a README and never runs a workflow
  # file, so a change confined to *.md or .github/** exercises nothing it
  # checks — a throwaway Go module built and tested on two OSes for a change
  # `workflows` (zizmor) and `lint` already cover between them.
  #
  # Anything short of "every changed file matches" — including a trigger this
  # cannot diff, like workflow_dispatch — runs the full matrix. Guessing wrong
  # the expensive way (running it) is fine; guessing wrong the cheap way
  # (skipping it) is a hole in the gate.
  changes:
    name: Detect changes irrelevant to consumer-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      smoke_skippable: ${{ steps.diff.outputs.smoke_skippable }}
    steps:
      - name: 'Setup: check out the repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0

      - name: 'Setup: the CI scripts'
        uses: ./.github/actions/setup-ci

      - name: 'Decide: does this change touch anything outside docs and workflows'
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node .github/ci/changes-detect.ts

  lint:
    name: Lint
    strategy:
      # Both, always: a divergence between BSD and GNU userland is exactly the
      # kind of thing one green check would hide, and knowing which of the two
      # broke is the whole value of running both.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: 'Setup: check out the repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes with the checkout credential, so it has no
          # reason to be left behind in .git/config.
          persist-credentials: false
          ref: ${{ env.CHECKOUT_REF }}
          # The modules resolve git state for their version scheme; the tags
          # are what make that resolution realistic rather than a fallback.
          fetch-depth: 0

      - name: 'Setup: Task'
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Setup: the CI scripts'
        uses: ./.github/actions/setup-ci

      - name: 'Guard: every module lints'
        run: task lint

  contracts:
    # The scanning gates against the real tools they wrap. The behaviour tests
    # shim every tool, and each gate bug so far lived between a shim and the
    # tool: checkov's exit 1 on a finding, trivy taking the last of a repeated
    # flag. Every pull request, so a Renovate bump of one of the pins below is
    # proved at the new version before it merges itself.
    name: Tool contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # One official image per tool, wrapped onto PATH by contract-tools.ts.
      # renovate: datasource=docker depName=aquasec/trivy
      TRIVY_VERSION: 0.76.1
      # renovate: datasource=docker depName=hadolint/hadolint
      HADOLINT_VERSION: v2.15.1
      # renovate: datasource=docker depName=zricethezav/gitleaks
      GITLEAKS_VERSION: v8.30.1
      # renovate: datasource=docker depName=bridgecrew/checkov
      CHECKOV_VERSION: 3.4.0
      # The cluster the k8s contract runs against, and the kubectl it uses.
      # renovate: datasource=github-releases depName=kubernetes-sigs/kind
      KIND_VERSION: v0.33.0
      # renovate: datasource=github-releases depName=kubernetes/kubernetes
      KUBECTL_VERSION: v1.37.2
      # kind names the context kind-<cluster>.
      CONTRACTS_KUBE_CONTEXT: kind-contracts
    steps:
      - name: 'Setup: check out the repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes with the checkout credential, so it has no
          # reason to be left behind in .git/config.
          persist-credentials: false
          ref: ${{ env.CHECKOUT_REF }}

      - name: 'Setup: Task'
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Setup: the CI scripts'
        uses: ./.github/actions/setup-ci

      - name: 'Setup: the pinned tools'
        run: node .github/ci/contract-tools.ts

      # The cluster is named after the context, which is kind-<cluster>, so
      # the two cannot drift apart.
      - name: 'Setup: a kind cluster for the k8s contract'
        run: kind create cluster --name "${CONTRACTS_KUBE_CONTEXT#kind-}" --wait 120s

      - name: 'Guard: every gate holds against the real tool'
        run: task contracts

  consumer-smoke:
    # A consumer is the only thing that exercises the modules the way they are
    # actually used — included, with the consumer's vars overriding the
    # defaults. This builds a throwaway one rather than depending on any other
    # repository being present.
    #
    # The skip below is per-step, not a job-level `if:`. Branch protection
    # requires "Consumer smoke (ubuntu-latest)"/"(macos-latest)" by name, and
    # a job-level `if:` that evaluates false skips the matrix expansion itself
    # — the two named checks never appear at all, which blocks a merge rather
    # than passing it. Every step skipping instead leaves both checks present
    # and green in seconds.
    name: Consumer smoke
    needs: changes
    strategy:
      # Both, always: a divergence between BSD and GNU userland is exactly the
      # kind of thing one green check would hide, and knowing which of the two
      # broke is the whole value of running both.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: 'Setup: check out the repository'
        if: needs.changes.outputs.smoke_skippable != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes with the checkout credential, so it has no
          # reason to be left behind in .git/config.
          persist-credentials: false
          ref: ${{ env.CHECKOUT_REF }}
          path: taskfiles

      - name: 'Setup: Task'
        if: needs.changes.outputs.smoke_skippable != 'true'
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Setup: Go'
        if: needs.changes.outputs.smoke_skippable != 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          # The fixture has no dependencies, so a module cache saves nothing —
          # and this workflow runs on tag pushes, where a writable cache is a
          # path from a pull request into a release build.
          cache: false

      - name: 'Setup: the CI scripts'
        if: needs.changes.outputs.smoke_skippable != 'true'
        uses: ./taskfiles/.github/actions/setup-ci
        with:
          path: taskfiles

      - name: 'Setup: a consumer that includes the library'
        if: needs.changes.outputs.smoke_skippable != 'true'
        run: node "$GITHUB_WORKSPACE/taskfiles/.github/ci/smoke-setup-consumer.ts"

      - name: 'Verify: every module loads side by side'
        if: needs.changes.outputs.smoke_skippable != 'true'
        working-directory: consumer
        # This is the check that catches a module quietly claiming a name
        # another module already uses.
        run: task --list-all > /dev/null

      - name: 'Verify: cosign no-ops cleanly with no key and no binary'
        if: needs.changes.outputs.smoke_skippable != 'true'
        working-directory: consumer
        # cosign is the one module that reads another module's derived vars
        # (_REL_VERSION, _REL_IMAGE) rather than its own — the most likely
        # place for the var-namespace scoping the whole library depends on to
        # break quietly. COSIGN_SIGN=0 exercises every task's status guard
        # without needing cosign or syft installed, which a real sign/attest
        # run would.
        run: node "$GITHUB_WORKSPACE/taskfiles/.github/ci/smoke-cosign-noop.ts"

      - name: 'Verify: helm no-ops cleanly with no cluster'
        if: needs.changes.outputs.smoke_skippable != 'true'
        working-directory: consumer
        # helm:list's own status guard skips it when kubectl cannot reach a
        # cluster, which is always true here — this proves that guard, not the
        # Helm listing itself.
        run: node "$GITHUB_WORKSPACE/taskfiles/.github/ci/smoke-helm-noop.ts"

      - name: 'Verify: pnpm:pin:check catches a pnpm shadowing the shim'
        if: needs.changes.outputs.smoke_skippable != 'true'
        # The shadowing pnpm here is the pinned version itself, so a check that
        # only compares versions passes - which is the blind spot this closes.
        # The same PATH with the shim first must still pass.
        run: node "$GITHUB_WORKSPACE/taskfiles/.github/ci/smoke-pnpm-pin-check.ts"

      - name: 'Verify: codegen actually generates'
        if: needs.changes.outputs.smoke_skippable != 'true'
        working-directory: consumer
        # `go generate` is the one step of the chain that needs no external
        # tool, so it is the one the library can prove end to end. It also
        # exercises the module's GOWORK=off, which is what made generation fail
        # for a real consumer before it was set.
        run: node "$GITHUB_WORKSPACE/taskfiles/.github/ci/smoke-codegen-generate.ts"

      - name: 'Verify: proto:check derives what it watches, and refuses when it cannot'
        if: needs.changes.outputs.smoke_skippable != 'true'
        # No buf here, for the reason the step above gives. A shim stands in for
        # the generator and writes a fixed "generated" file, which lets this
        # gate's own behaviours be exercised: the derivation, drift, a
        # regenerated change that is not committed yet, an unparseable
        # template, and a target with nothing committed under it.
        run: node "$GITHUB_WORKSPACE/taskfiles/.github/ci/smoke-codegen-proto-check.ts"

      - name: 'Verify: the secrets gate asks gitleaks to say where, with values redacted'
        if: needs.changes.outputs.smoke_skippable != 'true'
        # gitleaks is not installed here, for the reason the codegen steps give. A
        # shim that records its argv is enough, because what matters is the pair of
        # flags: -v so a finding names its rule, file, line and commit, --redact so
        # neither the secret nor the surrounding match reaches the log. Dropping
        # either one is the regression this guards.
        run: node "$GITHUB_WORKSPACE/taskfiles/.github/ci/smoke-security-secrets.ts"

      - name: 'Verify: checkov passes its flags through and treats the version as data'
        if: needs.changes.outputs.smoke_skippable != 'true'
        # checkov is not installed here; a shim answers --version and records
        # the scan's argv. CHECKOV_FLAGS is shell by contract and must arrive
        # as flags; CHECKOV_VERSION is data — a command substitution in it used
        # to run.
        run: node "$GITHUB_WORKSPACE/taskfiles/.github/ci/smoke-checkov.ts"

      - name: 'Verify: helm passes the context and namespace as single arguments'
        if: needs.changes.outputs.smoke_skippable != 'true'
        # Shims for kubectl (a reachable cluster) and helm (records argv). The
        # context and namespace are data: one argument each, never parsed —
        # a command substitution in the context used to run, and a namespace
        # with a space used to split.
        run: node "$GITHUB_WORKSPACE/taskfiles/.github/ci/smoke-helm-args.ts"

      - name: 'Verify: runtime install passes every value as one argument'
        if: needs.changes.outputs.smoke_skippable != 'true'
        # kind as the representative: the runtime variants share this shape,
        # and check:runtime holds them to it. Shims for kind and helm;
        # the namespace and values path carry spaces, the service name a
        # command substitution that used to run, and HELM_UPGRADE_FLAGS is
        # shell by contract and must arrive as flags.
        run: node "$GITHUB_WORKSPACE/taskfiles/.github/ci/smoke-runtime-install.ts"

      - name: 'Verify: compose splits the engine and keeps the file whole'
        if: needs.changes.outputs.smoke_skippable != 'true'
        # COMPOSE_ENGINE is shell by contract — "podman compose" is a command
        # and its first argument — while COMPOSE_FILE is data and must arrive
        # as one argument even with a space in it. A shim stands in for podman.
        run: node "$GITHUB_WORKSPACE/taskfiles/.github/ci/smoke-compose.ts"

      - name: 'Verify: sealed-secrets passes the context and paths as data'
        if: needs.changes.outputs.smoke_skippable != 'true'
        # Shims for kubectl (records argv, prints a Secret) and kubeseal (passes
        # it through). The context carries a command substitution that used to
        # run; the output sits in a directory with a space; literals split into
        # one --from-literal each.
        run: node "$GITHUB_WORKSPACE/taskfiles/.github/ci/smoke-sealed-secrets.ts"

      - name: 'Verify: python passes each source dir and the typecheck module as data'
        if: needs.changes.outputs.smoke_skippable != 'true'
        # uv as the representative of the python family; a shim records every
        # call. PY_SRC lists two directories that must arrive as two arguments,
        # PY carries a command substitution that used to run in doctor, and
        # TYPECHECK_MODULE must reach Python as an argument rather than as code.
        run: node "$GITHUB_WORKSPACE/taskfiles/.github/ci/smoke-python.ts"

      - name: 'Verify: auth passes its flags through and refuses a TTL that is not a number'
        if: needs.changes.outputs.smoke_skippable != 'true'
        # step is not installed here; a shim records its argv. STEP_FLAGS is
        # shell by contract and must arrive split into flags. The TTL goes into
        # $(( )), which evaluates text as an expression, so anything but digits
        # must be refused before it gets there — a command substitution in it
        # used to run.
        run: node "$GITHUB_WORKSPACE/taskfiles/.github/ci/smoke-auth.ts"

      - name: 'Verify: gosec runs the module''s own tool before one on PATH'
        if: needs.changes.outputs.smoke_skippable != 'true'
        # A gosec built outside the module carries gosec's own x/tools, which can
        # be too old for the export data the module's Go writes. So a module that
        # pins gosec with a `tool` directive must get that one even with another
        # gosec on PATH; a module without one falls back to PATH; and with
        # neither the task fails naming `go get -tool`. The tool here is a local
        # stand-in that records its argv, so nothing is fetched.
        run: node "$GITHUB_WORKSPACE/taskfiles/.github/ci/smoke-security-gosec.ts"

      - name: 'Verify: pnpm:pin:update survives a postinstall that calls pnpm'
        if: needs.changes.outputs.smoke_skippable != 'true'
        # The machine this broke on had a standalone pnpm ahead of the corepack
        # shim. A postinstall calling `pnpm` inside `corepack use` reached that
        # one, which refuses to switch versions under corepack, and the bump
        # failed after corepack had already rewritten "packageManager". This
        # builds that PATH, then asserts the pin moved AND the postinstall ran
        # on the new version - skipping the script outright would pass the
        # first half and fail the second.
        run: node "$GITHUB_WORKSPACE/taskfiles/.github/ci/smoke-pnpm-pin-update.ts"

      - name: 'Verify: the go module compiles, tests and builds'
        if: needs.changes.outputs.smoke_skippable != 'true'
        working-directory: consumer
        # Four tasks that do work rather than report it. `build` is left out
        # deliberately: GO_MAIN defaults to ./cmd/..., which this fixture does
        # not have, and a package with no main is the shape most consumers of
        # the other three tasks actually are.
        run: node "$GITHUB_WORKSPACE/taskfiles/.github/ci/smoke-go-build.ts"

      - name: 'Verify: go:fmt:check catches what go:fmt would rewrite'
        if: needs.changes.outputs.smoke_skippable != 'true'
        working-directory: consumer
        # gofmt -l exits 0 whether or not it found anything — a wrapper task
        # that only checked "did the command run" rather than "did it list a
        # file" would pass on dirty code every time. Un-formatting a file and
        # asserting the non-zero exit is the only way to prove the wrapper's
        # own pass/fail logic, not just that gofmt runs.
        run: node "$GITHUB_WORKSPACE/taskfiles/.github/ci/smoke-go-fmt-check.ts"

      - name: "Verify: the consumer's vars reach the modules"
        if: needs.changes.outputs.smoke_skippable != 'true'
        working-directory: consumer
        # The scoping rule the whole library is built around: a var declared in
        # a module would shadow this. VERSION_BASE is the cheapest observable
        # proof that it does not.
        run: node "$GITHUB_WORKSPACE/taskfiles/.github/ci/smoke-consumer-vars.ts"

  # Dispatches the release; the release itself is
  # .github/workflows/release.yml, which computes the version and creates the
  # tag. Named for what it does rather than `release`, so it reads as a step
  # in the pipeline instead of the release workflow's own name reused for a
  # job that only decides the MOMENT: every push to main whose checks passed
  # gets one, and semantic-release itself decides whether the commits since
  # the last tag are release-worthy at all (see release.config.cjs).
  #
  # `needs:` lists only jobs that also run on a push to main — the same ones
  # `gate` below needs. A job that runs on pull_request alone (there are none
  # among the required checks today) would skip here and take this job down
  # with it, since a `needs:` on a skipped job skips by default — the same
  # reason `always()` and the explicit results below exist: consumer-smoke
  # skips on a change irrelevant to it, and that skip must not read as a failure.
  dispatch-release:
    name: Dispatch release
    needs: [changes, workflows, lint, contracts, consumer-smoke]
    if: >-
      always() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.changes.result == 'success' &&
      needs.workflows.result == 'success' &&
      needs.lint.result == 'success' &&
      needs.contracts.result == 'success' &&
      (needs['consumer-smoke'].result == 'success' || needs['consumer-smoke'].result == 'skipped')
    permissions:
      contents: write # POST /repos/{owner}/{repo}/dispatches needs write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 'Setup: check out the CI scripts'
        # Only the CI scripts and the action that sets them up, under ci/:
        # this job needs nothing else from the tree.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.CHECKOUT_REF }}
          path: ci
          sparse-checkout: |
            .github/ci
            .github/actions
          sparse-checkout-cone-mode: false

      - name: 'Setup: the CI scripts'
        uses: ./ci/.github/actions/setup-ci
        with:
          path: ci

      - name: Dispatch the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node "$GITHUB_WORKSPACE/ci/.github/ci/release-dispatch.ts"

  # Cutting a tag is the only thing consumers actually see: they pin
  # `?ref=vX.Y.Z`, so a tag is a promise that this exact tree can be included
  # and works. `gate`, `consumable` and `publish` below check that promise
  # before publishing the release — the way a consumer would, over the
  # network, through the git include path, not from a local checkout — and
  # only after the checks above them have already passed for this exact ref.
  gate:
    name: Gate
    needs: [changes, workflows, lint, contracts, consumer-smoke]
    # Only meaningful on a tag: an ordinary branch push or PR has nothing to
    # release, and this is what keeps the release jobs from running at all —
    # `consumable` and `publish` skip too, since a `needs:` on a skipped job
    # skips by default. always() plus the explicit results below is the same
    # tolerance dispatch-release needs: consumer-smoke skips on a change
    # irrelevant to it, and that must read as fine rather than as this job's
    # own skip.
    if: >-
      always() &&
      (startsWith(github.ref, 'refs/tags/v') || inputs.tag != '') &&
      needs.changes.result == 'success' &&
      needs.workflows.result == 'success' &&
      needs.lint.result == 'success' &&
      needs.contracts.result == 'success' &&
      (needs['consumer-smoke'].result == 'success' || needs['consumer-smoke'].result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 'Setup: check out the tag'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes with the checkout credential, so it has no
          # reason to be left behind in .git/config.
          persist-credentials: false
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0

      - name: 'Setup: the CI scripts'
        uses: ./.github/actions/setup-ci

      - name: 'Guard: releases only from main'
        # github.ref here is refs/tags/vX.Y.Z, never a branch — comparing it to
        # refs/heads/main would refuse every release. The invariant that
        # actually matters is that main contains the tagged commit: consumers
        # pin `?ref=vX.Y.Z` and fetch that exact tree, so a tag cut on a side
        # branch would publish a tree main never held and CI on main never
        # saw, forking the released line with nothing to say it had happened.
        #
        # HEAD rather than the tag ref: the checkout above is already the
        # tagged commit, under a tag push and a workflow_dispatch alike.
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: node .github/ci/gate-main-only.ts

      - name: 'Guard: the tag is SemVer'
        # Helm and OCI both reject a chart version that is not SemVer-2, and
        # the modules mint chart versions from these tags. A tag that cannot be
        # a chart version is a tag no consumer can use.
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: node .github/ci/gate-semver.ts

  consumable:
    name: Consumable over git
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 'Setup: check out the CI scripts'
        # Only the CI scripts and the action that sets them up, under ci/:
        # the modules themselves must still arrive over the git include
        # below, not from a checkout.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.CHECKOUT_REF }}
          path: ci
          sparse-checkout: |
            .github/ci
            .github/actions
          sparse-checkout-cone-mode: false

      - name: 'Setup: the CI scripts'
        uses: ./ci/.github/actions/setup-ci
        with:
          path: ci

      - name: 'Setup: Task'
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Setup: git credentials for the include fetch'
        # Task shells out to the system git for a remote include, so the token
        # goes in through git's own config rather than into the Taskfile — and
        # through env rather than `${{ }}`, so it is never substituted into the
        # rendered script.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: 'Verify: the tag includes the way a consumer does'
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        # Deliberately NOT the local checkout: this is the only step that proves
        # the published tag can be fetched, that every module resolves through
        # the git include path, and that the trust prompt does not block CI.
        run: node "$GITHUB_WORKSPACE/ci/.github/ci/consumable-include.ts"

  publish:
    name: Publish
    needs: [gate, consumable]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # The only job in this file that needs more than read, which is why the
      # elevation sits here rather than at the top.
      contents: write # `gh release create` writes the release and its notes
    steps:
      - name: 'Setup: check out the tag'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes with the checkout credential, so it has no
          # reason to be left behind in .git/config.
          persist-credentials: false
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0

      - name: 'Setup: the CI scripts'
        uses: ./.github/actions/setup-ci

      - name: 'Publish: the GitHub release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        # Notes come from merged PRs since the previous tag, which is why
        # opening one carries a label — see .github/release.yml.
        run: node .github/ci/publish-release.ts
