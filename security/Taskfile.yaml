version: "3"

# ─────────────────────────────────────────────────────────────────────────────
# security — the scans that are worth running before a release.
#
#   includes:
#     security:
#       taskfile: '{{.TASKLIB}}security{{.TASKLIB_REF}}'
#       dir: .
#       vars: { GO_MODULES: "backend/api backend/worker" }
#
# Each tool is optional in the sense that a missing binary produces an install
# hint rather than a stack trace, but present-and-failing is always fatal: a
# scan that can be silently skipped is a scan that does not exist.
#
# ── Inputs ───────────────────────────────────────────────────────────────────
#   GO_MODULES   whitespace-separated module directories for the Go scans
#   BASE         branch the new-findings and breaking gates compare against
#   CHECKOV_CONFIG     default .checkov.yaml
#   CHECKOV_BASELINE   default .checkov.baseline
#   CHECKOV_FRAMEWORKS frameworks the triage view walks
#                      (default: github_actions dockerfile helm kubernetes)
#   GOSEC_FLAGS        extra gosec flags
#   GITLEAKS_BASELINE  findings accepted as known, so the gate reports only new ones
# ─────────────────────────────────────────────────────────────────────────────

silent: true

vars:
  # Whitespace-separated module directories for the Go scans. Unset means the
  # repo root is the only module.
  _SEC_MODULES: '{{.GO_MODULES | default "."}}'
  # Branch the breaking-change and new-issue gates compare against.
  _SEC_BASE: '{{.BASE | default "main"}}'
  _SEC_CKV_CFG: '{{.CHECKOV_CONFIG | default ".checkov.yaml"}}'
  _SEC_CKV_BASE: '{{.CHECKOV_BASELINE | default ".checkov.baseline"}}'
  _SEC_CKV_FW: '{{.CHECKOV_FRAMEWORKS | default "github_actions dockerfile helm kubernetes"}}'
  _SEC_GOSEC_FLAGS: '{{.GOSEC_FLAGS | default ""}}'
  _SEC_GL_BASE: '{{.GITLEAKS_BASELINE | default ""}}'

tasks:

  all:
    desc: "Run every scan: vulnerabilities, lint, secrets, filesystem, proto compatibility"
    cmds:
      - task: vuln
      - task: lint
      - task: secrets
      - task: trivy

  vuln:
    desc: "govulncheck across every Go module — vulnerabilities the code actually reaches"
    preconditions:
      - sh: command -v govulncheck >/dev/null
        msg: "govulncheck is not installed — go install golang.org/x/vuln/cmd/govulncheck@latest"
    cmds:
      - for: { var: _SEC_MODULES }
        task: _in-module
        vars: { MODULE: "{{.ITEM}}", CMD: "govulncheck ./...", LABEL: "govulncheck" }

  lint:
    desc: "golangci-lint across every Go module, limited to issues new since {{._SEC_BASE}}"
    # Whole-repo mode on a codebase with years of accumulated findings is a
    # permanently red gate that everyone learns to ignore. New-since-base is a
    # gate that can actually stay green. Full audit: golangci-lint run ./...
    preconditions:
      - sh: command -v golangci-lint >/dev/null
        msg: "golangci-lint is not installed — brew install golangci-lint"
    cmds:
      - for: { var: _SEC_MODULES }
        task: _in-module
        vars:
          MODULE: "{{.ITEM}}"
          CMD: "golangci-lint run --new-from-merge-base={{._SEC_BASE}} ./..."
          LABEL: "golangci-lint"

  secrets:
    desc: "gitleaks — committed credentials anywhere in the history"
    preconditions:
      - sh: command -v gitleaks >/dev/null
        msg: "gitleaks is not installed — brew install gitleaks"
    cmds:
      - echo "▸ sec · gitleaks"
      # A repository with accepted historical findings passes a baseline; without
      # one every old finding is reported again on every run, and a gate that
      # always fails is a gate nobody reads.
      - gitleaks git . --no-banner --redact{{if ._SEC_GL_BASE}} --baseline-path {{._SEC_GL_BASE}}{{end}}
      - echo "✔ sec · no secrets in history"

  trivy:
    desc: "trivy — vulnerable dependencies and secrets (blocking) plus IaC misconfig (report-only)"
    preconditions:
      - sh: command -v trivy >/dev/null
        msg: "trivy is not installed — brew install trivy"
    cmds:
      - echo "▸ sec · trivy fs"
      - trivy fs --scanners vuln,secret --exit-code 1 --quiet .
      # Misconfiguration findings are informational: they are dense, noisy, and
      # blocking on them would stop every release for a Kubernetes default.
      - trivy config --exit-code 0 --quiet .
      - echo "✔ sec · trivy clean"

  proto:breaking:
    desc: "buf breaking — refuse incompatible proto changes against {{._SEC_BASE}}"
    preconditions:
      - sh: command -v buf >/dev/null
        msg: "buf is not installed — brew install bufbuild/buf/buf"
    cmds:
      - echo "▸ sec · buf breaking vs {{._SEC_BASE}}"
      - buf breaking --against '.git#branch={{._SEC_BASE}}'
      - echo "✔ sec · proto contract compatible"

  _in-module:
    internal: true
    dir: "{{.MODULE}}"
    cmds:
      - echo "▸ sec · {{.LABEL}} · {{.MODULE}}"
      - "{{.CMD}}"

  # ═══ infrastructure-as-code ═════════════════════════════════════════════════

  checkov:
    desc: "Policy-scan manifests, charts, Dockerfiles and workflows against the baseline"
    preconditions:
      - sh: command -v checkov >/dev/null
        msg: "checkov is not installed — pipx install checkov"
      - sh: test -f {{._SEC_CKV_CFG}}
        msg: "{{._SEC_CKV_CFG}} not found — set CHECKOV_CONFIG"
      # The config names the baseline, so a missing baseline is not "no findings
      # accepted yet" — it is checkov reading a file that is not there.
      - sh: test -f {{._SEC_CKV_BASE}}
        msg: "{{._SEC_CKV_BASE}} not found, and the config references it — create it with security:checkov:baseline"
    cmds:
      - checkov --config-file {{._SEC_CKV_CFG}}
      - echo "✔ security · checkov · no findings outside the baseline"

  checkov:all:
    desc: "Every checkov finding, baselined ones included — a triage view, never a gate"
    preconditions:
      - sh: command -v checkov >/dev/null
        msg: "checkov is not installed — pipx install checkov"
    # Deliberately ignores the baseline and the config: this is the view for
    # deciding what to fix next, not a pass/fail check.
    cmds:
      - >-
        checkov -d . --compact
        {{range $f := splitList " " ._SEC_CKV_FW}}--framework {{$f}} {{end}}

  checkov:baseline:
    desc: "Regenerate the checkov baseline — only after deliberately fixing findings"
    preconditions:
      - sh: command -v checkov >/dev/null
        msg: "checkov is not installed — pipx install checkov"
    prompt: |
      Regenerating the baseline accepts every CURRENT finding as permitted,
      including any regression introduced since the last run. Do this after
      fixing findings, never to make a red build green. Continue?
    cmds:
      # Counted before and after, because the failure mode is silent: a baseline
      # regenerated to clear one fixed finding also swallows anything that broke
      # since, and the run that does it looks exactly like the run that does not.
      - cmd: |-
          count() {
            python3 -c "import json,sys;d=json.load(open(sys.argv[1]));print(sum(len(fi.get('check_ids',[])) for f in d['failed_checks'] for fi in f.get('findings',[])))" "$1" 2>/dev/null || echo 0
          }
          before=$(count '{{._SEC_CKV_BASE}}')
          checkov --config-file '{{._SEC_CKV_CFG}}' --create-baseline >/dev/null 2>&1 || true
          after=$(count '{{._SEC_CKV_BASE}}')
          echo "▸ security · checkov · baselined findings: ${before} → ${after}"
          if [ "${after}" -gt "${before}" ]; then
            echo "⚠ security · checkov · the baseline GREW — something new was accepted rather than fixed" >&2
          fi

  # ═══ Go static analysis ═════════════════════════════════════════════════════

  gosec:
    desc: "gosec — insecure patterns the compiler is happy with"
    preconditions:
      - sh: command -v gosec >/dev/null
        msg: "gosec is not installed — go install github.com/securego/gosec/v2/cmd/gosec@latest"
    cmds:
      - for: { var: _SEC_MODULES }
        cmd: >-
          cd {{.ITEM}} &&
          gosec {{._SEC_GOSEC_FLAGS}} ./... &&
          echo "✔ security · gosec · {{.ITEM}} clean"
