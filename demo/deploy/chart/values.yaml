replicaCount: 1

image:
  # The image name alone. ../../Taskfile.yaml sets the full repository from
  # REGISTRY when it installs, so the registry is written down in one place.
  repository: taskfiles-demo
  tag: ""
  pullPolicy: IfNotPresent

service:
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 100m
    memory: 64Mi
