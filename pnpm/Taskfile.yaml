version: "3"

# ─────────────────────────────────────────────────────────────────────────────
# pnpm — keep the pnpm version pin honest across a repository's apps.
#
#   includes:
#     pnpm:
#       taskfile: '{{printf .TASKLIB "pnpm"}}'
#       dir: .
#       vars: { PNPM_APPS: "frontend/admin-app frontend/clinic-app" }
#
# ── Inputs ───────────────────────────────────────────────────────────────────
#   PNPM_APPS    whitespace-separated app directories, each with a package.json
#                carrying a "packageManager": "pnpm@…" pin
#   PNPM_DOCKERFILES
#                whitespace-separated Dockerfiles that pin the same version a
#                second time as `ARG PNPM_VERSION=…`. Optional; empty means the
#                repository has no such file.
#   SPEC         which release `_pin:to` resolves — a major ("12"), an exact
#                version, "latest", or "current-major" (the default path)
#
# Repo-scoped, not component-scoped: every app moves together. A repository
# where one app is on one pnpm and another on a different one writes two
# lockfile dialects, and nothing notices until an image build breaks.
#
# pnpm is delivered by corepack, so the pin in package.json IS the version
# every developer, CI job and image build runs. `pnpm self-update` cannot work
# here — corepack owns the shim and refuses it. `corepack use` is the supported
# path and does both things a pin bump needs: it rewrites "packageManager" with
# the release's integrity hash, and re-runs install so the lockfile is written
# by the new pnpm rather than the previous major's.
#
# One thing that is not obvious and cost a real debugging session: corepack
# resolves the pin from the CURRENT directory, so `pnpm -C <app> …` runs
# corepack's own default rather than the app's pin and then refuses to switch.
# Every command here cd's into the app instead.
#
# An image build cannot read package.json before it has a package manager, so a
# repository that installs pnpm in its Dockerfile pins the version there too.
# That second pin is invisible to corepack and to npm tooling alike: it drifts
# silently, and the image then builds a lockfile a different pnpm wrote. Name
# those files in PNPM_DOCKERFILES and both pins move together.
# ─────────────────────────────────────────────────────────────────────────────

silent: true

vars:
  _PNPM_APPS: '{{.PNPM_APPS | default "."}}'
  _PNPM_DOCKERFILES: '{{.PNPM_DOCKERFILES | default ""}}'
  # Status markers. The shape carries the meaning, so a line still reads in
  # a monochrome log; the colour sits on top and drops out under NO_COLOR.
  _PNPM_RUN: '{{if .NO_COLOR}}◉{{else}}{{"\x1b[36m◉\x1b[0m"}}{{end}}'
  _PNPM_OK: '{{if .NO_COLOR}}✔{{else}}{{"\x1b[32m✔\x1b[0m"}}{{end}}'
  _PNPM_WARN: '{{if .NO_COLOR}}▲{{else}}{{"\x1b[33m▲\x1b[0m"}}{{end}}'
  _PNPM_ERR: '{{if .NO_COLOR}}✖{{else}}{{"\x1b[31m✖\x1b[0m"}}{{end}}'

tasks:

  pin:update:
    desc: "Bump pnpm to the newest release of the major the repo sits on"
    cmds:
      - task: _pin:to
        vars: { SPEC: current-major }

  pin:update:major:
    desc: "Cross a pnpm major deliberately — task pnpm:pin:update:major -- 12"
    cmds:
      - task: _pin:to
        vars: { SPEC: '{{.CLI_ARGS | default "latest"}}' }

  pin:check:
    desc: "Fail when the apps' pnpm pins diverge, or corepack is being bypassed"
    preconditions:
      - sh: command -v corepack >/dev/null
        msg: "corepack is not on PATH (it ships with Node) — run `corepack enable`"
    cmds:
      - cmd: |-
          set -u
          rc=0; pins=""
          for a in {{._PNPM_APPS}}; do
            pm=$(cd "$a" && node -p "require('./package.json').packageManager || ''" 2>/dev/null)
            case "$pm" in
              pnpm@*) ;;
              *) printf '%s\n' "{{._PNPM_ERR}} pnpm · $a has no pnpm pin" >&2; rc=1; continue ;;
            esac
            v=${pm#pnpm@}; v=${v%%+*}; pins="$pins $v"
            # corepack resolves the shim per directory, so this is the version
            # an install in that app would really use.
            got=$(cd "$a" && pnpm --version 2>/dev/null)
            if [ "$got" != "$v" ]; then
              printf '%s\n' "{{._PNPM_ERR}} pnpm · $a pins $v but reports ${got:-<none>} — a global pnpm is shadowing the corepack shim" >&2
              rc=1
            fi
          done
          for d in {{._PNPM_DOCKERFILES}}; do
            if [ ! -f "$d" ]; then
              printf '%s\n' "{{._PNPM_ERR}} pnpm · $d does not exist" >&2; rc=1; continue
            fi
            arg=$(sed -n 's/^ARG PNPM_VERSION=//p' "$d" | head -1)
            if [ -z "$arg" ]; then
              printf '%s\n' "{{._PNPM_ERR}} pnpm · $d carries no ARG PNPM_VERSION" >&2; rc=1; continue
            fi
            pins="$pins $arg"
          done
          if [ "$(printf '%s\n' $pins | sort -u | grep -c .)" -gt 1 ]; then
            printf '%s\n' "{{._PNPM_ERR}} pnpm · the pins disagree:$pins" >&2
            rc=1
          fi
          [ "$rc" = 0 ] && printf '%s\n' "{{._PNPM_OK}} pnpm · every pin at$(printf '%s\n' $pins | sort -u | head -1 | sed 's/^/ /')"
          exit "$rc"

  _pin:to:
    internal: true
    preconditions:
      - sh: command -v corepack >/dev/null
        msg: "corepack is not on PATH (it ships with Node) — run `corepack enable`"
    cmds:
      - cmd: |-
          set -u
          pins=""
          for a in {{._PNPM_APPS}}; do
            pm=$(cd "$a" && node -p "require('./package.json').packageManager || ''" 2>/dev/null)
            case "$pm" in
              pnpm@*) ;;
              *) printf '%s\n' "{{._PNPM_ERR}} pnpm · $a carries no pnpm \"packageManager\" pin" >&2; exit 1 ;;
            esac
            v=${pm#pnpm@}; pins="$pins ${v%%+*}"
          done
          for d in {{._PNPM_DOCKERFILES}}; do
            arg=$(sed -n 's/^ARG PNPM_VERSION=//p' "$d" 2>/dev/null | head -1)
            case "$arg" in
              "") printf '%s\n' "{{._PNPM_ERR}} pnpm · $d carries no ARG PNPM_VERSION" >&2; exit 1 ;;
              *) pins="$pins $arg" ;;
            esac
          done
          current=$(printf '%s\n' $pins | sort -u)
          if [ "$(printf '%s\n' "$current" | grep -c .)" != "1" ]; then
            printf '%s\n' "{{._PNPM_ERR}} pnpm · the pins disagree:$pins — reconcile with pnpm:pin:check" >&2
            exit 1
          fi

          spec='{{.SPEC}}'
          [ "$spec" = "current-major" ] && spec=${current%%.*}
          target=$(npm view "pnpm@$spec" version --json 2>/dev/null | node -p 'const v=JSON.parse(require("fs").readFileSync(0,"utf8"));Array.isArray(v)?v[v.length-1]:v' 2>/dev/null)
          case "$target" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) printf '%s\n' "{{._PNPM_ERR}} pnpm · the registry gave no stable version for '$spec'" >&2; exit 1 ;;
          esac

          if [ "$target" = "$current" ]; then
            printf '%s\n' "{{._PNPM_OK}} pnpm · already pinned at $current everywhere"
          else
            printf '%s\n' "{{._PNPM_RUN}} pnpm · $current → $target"
            for a in {{._PNPM_APPS}}; do
              ( cd "$a" && corepack use "pnpm@$target" ) || {
                printf '%s\n' "{{._PNPM_ERR}} pnpm · $a: corepack use pnpm@$target failed — the other apps may already be bumped" >&2
                exit 1
              }
            done
            # After the apps, so a corepack failure leaves both pins on the old
            # version rather than the Dockerfile ahead of the lockfile.
            for d in {{._PNPM_DOCKERFILES}}; do
              tmp="$d.pnpm-pin.$$"
              sed "s/^ARG PNPM_VERSION=.*/ARG PNPM_VERSION=$target/" "$d" > "$tmp" && mv "$tmp" "$d" || {
                rm -f "$tmp"
                printf '%s\n' "{{._PNPM_ERR}} pnpm · $d: could not rewrite ARG PNPM_VERSION" >&2
                exit 1
              }
            done
            printf '%s\n' "{{._PNPM_OK}} pnpm · pinned at $target everywhere — review the package.json, Dockerfile and lockfile diff"
          fi

          # A held-back major is reported, never taken silently.
          newest=$(npm view pnpm@latest version 2>/dev/null)
          if [ -n "$newest" ] && [ "${newest%%.*}" != "${target%%.*}" ]; then
            printf '%s\n' "{{._PNPM_WARN}} pnpm · $newest is out and this task stays inside major ${target%%.*}" >&2
            printf '%s\n' "         cross it deliberately: task pnpm:pin:update:major -- ${newest%%.*}" >&2
          fi
