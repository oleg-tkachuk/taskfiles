version: "3"

# ─────────────────────────────────────────────────────────────────────────────
# sealed-secrets — turn a value into a SealedSecret manifest that is safe to
# commit, and fetch the key that lets you do it offline.
#
#   includes:
#     sealed-secrets:
#       taskfile: '{{printf .TASKLIB "sealed-secrets"}}'
#       dir: .
#
# ── Inputs ───────────────────────────────────────────────────────────────────
# Pass these at the include's own `vars:`, not the consumer's top-level
# `vars:`. In a repository with more than one component the top level is
# shared with every other component — see README.md#variable-scoping.
#
#   KUBESEAL_FLAGS     verbatim extra kubeseal flags
#   SEALED_SECRETS_NS          controller namespace  (default sealed-secrets)
#   SEALED_SECRETS_CONTROLLER  controller name       (default sealed-secrets-controller)
#   K8S_CONTEXT                pin a cluster                (default: current)
#
# ── Per call ─────────────────────────────────────────────────────────────────
#   SECRET_NAMESPACE SECRET_NAME SECRET_OUTPUT   required by every sealing task
#   SECRET_KEY SECRET_VALUE                      seal, seal:merge
#   SECRET_FILE                                  seal:file
#   SECRET_LITERALS                              seal:literals
#
# `seal` takes the value as a variable, which puts it in this process's
# argument list for as long as kubectl runs — visible to anything that can read
# the process table on this machine. That is a fair trade for a one-off dev
# credential and a poor one for anything else: prefer `seal:file`, which reads
# from disk, when the value matters.
#
# Nothing here reads the cluster's secrets. Both tasks build a manifest locally
# with --dry-run=client and hand it to kubeseal, so the plaintext never leaves
# this machine and the output is encrypted to a key only the controller holds.
# ─────────────────────────────────────────────────────────────────────────────
# shell-verbatim: _SS_CTX _SS_KUBECTL _SS_SEAL KUBESEAL_FLAGS FROM

silent: true

vars:
  _SS_NS: '{{.SEALED_SECRETS_NS | default "sealed-secrets"}}'
  _SS_CTRL: '{{.SEALED_SECRETS_CONTROLLER | default "sealed-secrets-controller"}}'
  # kubectl and kubeseal both take the pinned context. kubeseal fetches the
  # controller's certificate from whatever cluster it talks to, so leaving it
  # on the current context sealed to that cluster's key while the manifest was
  # meant for the pinned one — a secret its own controller can never open.
  _SS_CTX: '{{if .K8S_CONTEXT}} --context {{.K8S_CONTEXT | q}}{{end}}'
  _SS_KUBECTL: 'kubectl{{._SS_CTX}}'
  _SS_SEAL: 'kubeseal{{._SS_CTX}} --controller-namespace {{._SS_NS | q}} --controller-name {{._SS_CTRL | q}}'
  # Status markers. The shape carries the meaning, so a line still reads in
  # a monochrome log; the colour sits on top and drops out under NO_COLOR.
  _SS_OK: '{{if .NO_COLOR}}✔{{else}}{{"\x1b[32m✔\x1b[0m"}}{{end}}'

tasks:

  seal:
    desc: "Seal one key/value into a SealedSecret manifest"
    requires:
      vars: [SECRET_NAMESPACE, SECRET_NAME, SECRET_KEY, SECRET_VALUE, SECRET_OUTPUT]
    cmds:
      - task: _seal
        vars:
          SECRET_NAMESPACE: '{{.SECRET_NAMESPACE}}'
          SECRET_NAME: '{{.SECRET_NAME}}'
          SECRET_OUTPUT: '{{.SECRET_OUTPUT}}'
          FROM: '--from-literal={{printf "%s=%s" .SECRET_KEY .SECRET_VALUE | q}}'

  seal:file:
    desc: "Seal every key in an env file into one SealedSecret manifest"
    requires:
      vars: [SECRET_NAMESPACE, SECRET_NAME, SECRET_FILE, SECRET_OUTPUT]
    preconditions:
      - sh: test -f {{.SECRET_FILE | q}}
        msg: "{{.SECRET_FILE}} not found"
    cmds:
      - task: _seal
        vars:
          SECRET_NAMESPACE: '{{.SECRET_NAMESPACE}}'
          SECRET_NAME: '{{.SECRET_NAME}}'
          SECRET_OUTPUT: '{{.SECRET_OUTPUT}}'
          FROM: '--from-env-file={{.SECRET_FILE | q}}'

  seal:literals:
    desc: "Seal several key/value pairs into one SealedSecret manifest"
    requires:
      vars: [SECRET_NAMESPACE, SECRET_NAME, SECRET_LITERALS, SECRET_OUTPUT]
    # `SECRET_LITERALS` is split on whitespace, which is what makes the list a list —
    # a value containing a space belongs in seal:file. Each pair is quoted on
    # its way into the script, so a quote, a semicolon, a $( ) or a glob in a
    # value reaches kubectl as data; spliced in bare, it ran as shell.
    cmds:
      - task: _seal
        vars:
          SECRET_NAMESPACE: '{{.SECRET_NAMESPACE}}'
          SECRET_NAME: '{{.SECRET_NAME}}'
          SECRET_OUTPUT: '{{.SECRET_OUTPUT}}'
          FROM: '{{range (regexSplit "\\s+" (trim .SECRET_LITERALS) -1)}}--from-literal={{q .}} {{end}}'

  _seal:
    internal: true
    requires:
      vars: [SECRET_NAMESPACE, SECRET_NAME, SECRET_OUTPUT, FROM]
    preconditions:
      - sh: command -v kubeseal >/dev/null
        msg: "kubeseal is not installed — https://github.com/bitnami-labs/sealed-secrets#installation"
    # Sealed into a file beside the output and moved over it only once both
    # kubectl and kubeseal have succeeded. Redirected straight to the output,
    # a failure in either one truncated a manifest that was already committed.
    cmds:
      - mkdir -p {{dir .SECRET_OUTPUT | q}}
      - cmd: |-
          set -euo pipefail
          tmp=$(mktemp {{printf "%s.XXXXXX" .SECRET_OUTPUT | q}})
          trap 'rm -f "$tmp"' EXIT
          {{._SS_KUBECTL}} create secret generic {{.SECRET_NAME | q}} \
            --namespace {{.SECRET_NAMESPACE | q}} {{.FROM}} --dry-run=client -o yaml \
            | {{._SS_SEAL}} --format yaml {{.KUBESEAL_FLAGS | default ""}} > "$tmp"
          mv "$tmp" {{.SECRET_OUTPUT | q}}
      - printf '%s sealed-secrets · %s/%s → %s\n' "{{._SS_OK}}" {{.SECRET_NAMESPACE | q}} {{.SECRET_NAME | q}} {{.SECRET_OUTPUT | q}}

  seal:merge:
    desc: "Seal one key and merge it into an existing SealedSecret, leaving the rest"
    requires:
      vars: [SECRET_NAMESPACE, SECRET_NAME, SECRET_KEY, SECRET_VALUE, SECRET_OUTPUT]
    preconditions:
      - sh: command -v kubeseal >/dev/null
        msg: "kubeseal is not installed — https://github.com/bitnami-labs/sealed-secrets#installation"
      - sh: test -f {{.SECRET_OUTPUT | q}}
        msg: "{{.SECRET_OUTPUT}} does not exist — seal the whole manifest first, then merge into it"
    # Rotating one credential in a manifest that holds several: --merge-into
    # rewrites that key's ciphertext and leaves every other key, and the file's
    # structure, as they were. The plaintext only ever reaches kubeseal's stdin.
    cmds:
      - cmd: |-
          set -euo pipefail
          {{._SS_KUBECTL}} create secret generic {{.SECRET_NAME | q}} \
            --namespace {{.SECRET_NAMESPACE | q}} \
            --from-literal={{printf "%s=%s" .SECRET_KEY .SECRET_VALUE | q}} \
            --dry-run=client -o yaml \
            | {{._SS_SEAL}} --format yaml {{.KUBESEAL_FLAGS | default ""}} --merge-into {{.SECRET_OUTPUT | q}}
      - printf '%s sealed-secrets · %s/%s · %s merged → %s\n' "{{._SS_OK}}" {{.SECRET_NAMESPACE | q}} {{.SECRET_NAME | q}} {{.SECRET_KEY | q}} {{.SECRET_OUTPUT | q}}

  pubkey:
    desc: "Print the controller's public certificate, for sealing without a cluster"
    preconditions:
      - sh: command -v kubeseal >/dev/null
        msg: "kubeseal is not installed — https://github.com/bitnami-labs/sealed-secrets#installation"
    # Committing this lets anyone seal a value for this cluster without reaching
    # it. It is a public key: it can encrypt and cannot decrypt.
    cmds:
      - '{{._SS_SEAL}} --fetch-cert'
