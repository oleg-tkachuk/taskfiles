version: "3"

# Development tasks for the library itself. Consumers never include this file —
# they include the modules beside it.
#
# `task lint` is the whole gate: the git hooks and CI both call these tasks
# rather than carrying their own copy of the checks, so there is one place a
# rule is written down and one place it changes.

silent: true

vars:
  # One directory per module, and an include names the directory rather than a
  # file inside it. The split is by domain, not by file size: `release` never
  # talks to a cluster and `k8s` never publishes anything, so a repository that
  # only does one of the two includes only one of them.
  MODULES: "release k8s go python uv node compose monorepo security argocd auth
    runtime/docker runtime/orbstack runtime/minikube runtime/kind runtime/k3d"
  # Every YAML the modules are made of, for the file-level checks.
  MODULE_FILES:
    sh: ls */Taskfile.yaml */*/Taskfile.yaml 2>/dev/null | sort -u | tr '\n' ' '

tasks:
  default:
    desc: "List every task"
    cmds:
      - task --list-all

  lint:
    desc: "Run every gate: modules parse, vars are scoped, output is quiet, README matches"
    cmds:
      - task: check:parse
      - task: check:vars
      - task: check:silent
      - task: check:readme

  # ─── gates ──────────────────────────────────────────────────────────────────

  check:parse:
    desc: "Load every module through Task's own parser"
    # The authoritative check: it catches what a YAML parser cannot — an
    # unknown key, a template that does not compile, a `for:` over something
    # that is not a list.
    cmds:
      - for: { var: MODULES }
        task: _parse
        vars: { MODULE: "{{.ITEM}}" }
      - echo "✔ taskfiles · every module parses"

  _parse:
    internal: true
    cmds:
      - task -t {{.MODULE}}/Taskfile.yaml --list-all >/dev/null
      - echo "  ✔ {{.MODULE}}"

  check:vars:
    desc: "Refuse a module that declares a top-level var without a leading underscore"
    # A var declared in an included Taskfile SHADOWS the including file's value
    # of the same name — and every include shares one namespace, so it shadows
    # it for the other modules too. A module declaring `PROJECT_NAME:` would
    # silently override every consumer's. The convention that avoids it: read
    # inputs inline as `{{.NAME | default "…"}}` and prefix declared vars `_`.
    cmds:
      - cmd: |-
          set -eu
          bare=$(awk '
            /^vars:/      { inv = 1; next }
            /^[^[:space:]]/ { inv = 0 }
            inv && /^  [A-Za-z_][A-Za-z0-9_]*:/ {
              key = $1; sub(/:$/, "", key)
              if (substr(key, 1, 1) != "_") print FILENAME " → " key
            }
          ' {{.MODULE_FILES}})
          if [ -n "$bare" ]; then
            echo "✖ taskfiles · these declared vars would shadow the consumer's:" >&2
            printf '  %s\n' "$bare" >&2
            echo "  Read the input as {{`{{`}}.NAME | default \"…\"{{`}}`}} at the use site," >&2
            echo "  and name the derived var _NAME." >&2
            exit 1
          fi
          echo "✔ taskfiles · no module shadows a consumer's vars"

  check:silent:
    desc: "Refuse a module that does not run quiet"
    # Without `silent: true` Task echoes every command before running it, and
    # the deliberate ▸/✔/⚠ lines drown in a transcript of the commands that
    # produced them.
    cmds:
      - cmd: |-
          set -eu
          fail=0
          for f in {{.MODULE_FILES}}; do
            grep -qE '^silent: true$' "$f" || { echo "✖ taskfiles · $f does not declare 'silent: true'" >&2; fail=1; }
          done
          [ "$fail" = 0 ] && echo "✔ taskfiles · every module runs quiet"
          exit "$fail"

  check:readme:
    desc: "Refuse a module missing from the README table, or a table row with no module"
    # The table is the map people navigate by: a module without a row is a
    # module nobody finds, and a row left after a rename sends someone to a
    # file that is not there.
    cmds:
      - cmd: |-
          set -eu
          fail=0
          for f in {{.MODULES}}; do
            grep -q "\`$f/\`" README.md || { echo "✖ taskfiles · $f has no row in the README module table" >&2; fail=1; }
          done
          for f in $(grep -oE '`[a-z-]+(/[a-z0-9-]+)?/`' README.md | tr -d '`' | sed 's|/$||' | sort -u); do
            [ -d "$f" ] || { echo "✖ taskfiles · README documents $f/, which is not in the repo" >&2; fail=1; }
          done
          [ "$fail" = 0 ] && echo "✔ taskfiles · README matches the modules on disk"
          exit "$fail"

  # ─── docs ───────────────────────────────────────────────────────────────────

  surface:
    desc: "Print the task surface of every module — the library's public API"
    cmds:
      - for: { var: MODULES }
        cmd: printf '\n── %s\n' '{{.ITEM}}' && task -t {{.ITEM}}/Taskfile.yaml --list-all | tail -n +2
