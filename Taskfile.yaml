version: "3"

# Development tasks for the library itself. Consumers never include this file —
# they include the modules beside it.
#
# `task lint` is the whole gate: the git hooks and CI both call these tasks
# rather than carrying their own copy of the checks, so there is one place a
# rule is written down and one place it changes.

silent: true

vars:
  # One directory per module, and an include names the directory rather than a
  # file inside it. The split is by domain, not by file size: `release` never
  # talks to a cluster and `k8s` never publishes anything, so a repository that
  # only does one of the two includes only one of them.
  # Modules with their own README. A family — a directory with no Taskfile of
  # its own whose subdirectories have one — shares a single README, so those
  # are checked separately; hence the top-level glob rather than PARSE_MODULES.
  # Discovered for the same reason PARSE_MODULES is: the hand-written list had
  # gone four modules stale (checkov, codegen, helm, sealed-secrets), and a
  # module missing from it walked past the README gate rather than failing it.
  #
  # demo/ is excluded from every list below: it is a consumer of this library,
  # not a module in it — its Taskfile owns bare var names the way a real
  # consumer's does, and has no README of its own to require.
  MODULES:
    sh: ls -d */Taskfile.yaml 2>/dev/null | grep -v '^demo/' | sed "s|/Taskfile.yaml||" | sort | tr "\n" " "
  # Everything that must parse, the runtime variants included.
  # Discovered, not listed: a hand-maintained list is one a new module can be
  # left out of, and a module outside it escapes the parse gate in silence.
  PARSE_MODULES:
    sh: ls -d */Taskfile.yaml */*/Taskfile.yaml 2>/dev/null | grep -v '^demo/' | sed "s|/Taskfile.yaml||" | sort | tr "\n" " "
  # Every YAML the modules are made of, for the file-level checks.
  MODULE_FILES:
    sh: ls */Taskfile.yaml */*/Taskfile.yaml 2>/dev/null | grep -v '^demo/' | sort -u | tr '\n' ' '
  # runtime, python — the directories that hold variants rather than a module.
  FAMILIES:
    sh: ls -d */*/Taskfile.yaml 2>/dev/null | grep -v '^demo/' | cut -d/ -f1 | sort -u | tr '\n' ' '
  # Status markers. The shape carries the meaning, so a line still reads in
  # a monochrome log; the colour sits on top and drops out under NO_COLOR.
  _LIB_OK: '{{if .NO_COLOR}}✔{{else}}{{"\x1b[32m✔\x1b[0m"}}{{end}}'
  _LIB_WARN: '{{if .NO_COLOR}}▲{{else}}{{"\x1b[33m▲\x1b[0m"}}{{end}}'
  _LIB_ERR: '{{if .NO_COLOR}}✖{{else}}{{"\x1b[31m✖\x1b[0m"}}{{end}}'

tasks:
  default:
    desc: "List every task"
    cmds:
      - task --list-all

  lint:
    desc: "Run every gate: modules parse, vars are scoped, output is quiet, README matches"
    cmds:
      - task: check:parse
      - task: check:vars
      - task: check:scope
      - task: check:silent
      - task: check:readme
      - task: check:surface
      - task: check:runtime-install

  # ─── gates ──────────────────────────────────────────────────────────────────

  check:parse:
    desc: "Load every module through Task's own parser"
    # The authoritative check: it catches what a YAML parser cannot — an
    # unknown key, a template that does not compile, a `for:` over something
    # that is not a list.
    cmds:
      - for: { var: PARSE_MODULES }
        task: _parse
        vars: { MODULE: "{{.ITEM}}" }
      - echo "{{._LIB_OK}} taskfiles · every module parses"

  _parse:
    internal: true
    cmds:
      - task -t {{.MODULE}}/Taskfile.yaml --list-all >/dev/null
      - echo "  {{._LIB_OK}} {{.MODULE}}"

  check:vars:
    desc: "Refuse a module var that is not prefixed, or a module that uses two prefixes"
    # Two rules, one reason. A var declared in an included Taskfile SHADOWS the
    # including file's value of the same name, and every include shares one
    # namespace — so a module declaring `PROJECT_NAME:` would silently override
    # every consumer's, and two modules declaring `_IMAGE:` differently would
    # each mean something else by it.
    #
    # So: read inputs inline as `{{`{{`}}.NAME | default "…"{{`}}`}}`, and give
    # every declared var this module's own prefix — `_REL_`, `_GO_`, `_CS_`.
    # A cross-module read (runtime and cosign read `_REL_VERSION`) is a read:
    # the module must not declare it.
    cmds:
      - cmd: |-
          set -eu
          fail=0
          for f in {{.MODULE_FILES}}; do
            vars=$(awk '
              /^vars:/      { inv = 1; next }
              /^[^[:space:]]/ { inv = 0 }
              inv && /^  [A-Za-z_][A-Za-z0-9_]*:/ { k = $1; sub(/:$/, "", k); print k }
            ' "$f")
            [ -n "$vars" ] || continue

            bare=$(printf '%s\n' "$vars" | grep -vE '^_[A-Z0-9]+_' || true)
            if [ -n "$bare" ]; then
              echo "{{._LIB_ERR}} taskfiles · $f declares vars that are not <_PREFIX_>-scoped:" >&2
              printf '    %s\n' $bare >&2
              fail=1
            fi

            prefixes=$(printf '%s\n' "$vars" | sed -nE 's/^(_[A-Z0-9]+_).*/\1/p' | sort -u)
            if [ "$(printf '%s\n' "$prefixes" | grep -c .)" -gt 1 ]; then
              echo "{{._LIB_ERR}} taskfiles · $f mixes prefixes: $(printf '%s ' $prefixes)" >&2
              fail=1
            fi
          done
          [ "$fail" = 0 ] && echo "{{._LIB_OK}} taskfiles · every module var is scoped to its own module"
          exit "$fail"

  check:scope:
    desc: "Refuse a module var that resolves an input the caller passes on the task call"
    # A var in a module's top-level `vars:` block is evaluated in that file's
    # own scope. It sees what the CONSUMER set at include time — and nothing a
    # caller passes on the call itself (`task: argocd:refresh` with
    # `vars: {APP_PREFIX: …}`). So a module var written to pre-chew such an
    # input resolves to empty while the task it feeds sees the real value.
    #
    # This is silent in the worst way. argocd/refresh filtered applications
    # with `grep -E {{`'`}}^$_ARGO_PREFIX{{`'`}}`, the prefix came back empty, the pattern
    # became `^`, and a task documented as touching one release hard-refreshed
    # all 69 applications in the cluster — including the infra ones its own
    # comment said must never be touched. It reported success every time.
    #
    # An input a task `requires:` is by definition allowed to arrive at call
    # time. Read it where it is used, not in the vars block.
    cmds:
      - cmd: |-
          set -eu
          fail=0
          for f in {{.MODULE_FILES}}; do
            out=$(awk '
              /^[[:space:]]*requires:[[:space:]]*$/ { req = 1; next }
              req && /^[[:space:]]*vars:[[:space:]]*\[/ {
                line = $0
                sub(/^[^[]*\[/, "", line); sub(/\].*$/, "", line)
                n = split(line, a, ",")
                for (i = 1; i <= n; i++) {
                  gsub(/[[:space:]]/, "", a[i])
                  if (a[i] != "") required[a[i]] = 1
                }
                req = 0; next
              }
              req && /^[[:space:]]*[^[:space:]#]/ { req = 0 }
              /^vars:/        { inv = 1; next }
              /^[^[:space:]]/ { inv = 0 }
              inv && /^  [A-Za-z_][A-Za-z0-9_]*:/ { vline[++nv] = $0 }
              END {
                for (i = 1; i <= nv; i++)
                  for (name in required)
                    if (vline[i] ~ ("[{][{][[:space:]]*[.]" name "[^A-Za-z0-9_]"))
                      printf "    %s\n      resolves %s, which a caller may pass on the call\n", vline[i], name
              }
            ' "$f")
            if [ -n "$out" ]; then
              echo "{{._LIB_ERR}} taskfiles · $f resolves a call-time input in its vars block:" >&2
              printf '%s\n' "$out" >&2
              fail=1
            fi
          done
          [ "$fail" = 0 ] && echo "{{._LIB_OK}} taskfiles · no module var resolves a call-time input"
          exit "$fail"

  check:silent:
    desc: "Refuse a module that does not run quiet"
    # Without `silent: true` Task echoes every command before running it, and
    # the deliberate ◉/✔/○ marker lines drown in a transcript of the commands
    # that produced them.
    cmds:
      - cmd: |-
          set -eu
          fail=0
          for f in {{.MODULE_FILES}}; do
            grep -qE '^silent: true$' "$f" || { echo "{{._LIB_ERR}} taskfiles · $f does not declare 'silent: true'" >&2; fail=1; }
          done
          [ "$fail" = 0 ] && echo "{{._LIB_OK}} taskfiles · every module runs quiet"
          exit "$fail"

  check:readme:
    desc: "Refuse a module with no README, or one the top-level README does not link"
    # The table in README.md is the map people navigate by, and a module's own
    # README is where they land. A module missing from either is a module nobody
    # finds; a link to a file that is not there sends them nowhere.
    cmds:
      - cmd: |-
          set -eu
          fail=0
          for m in {{.MODULES}}; do
            [ -f "$m/README.md" ] || { echo "{{._LIB_ERR}} taskfiles · $m/ has no README.md" >&2; fail=1; }
            grep -q "($m/README.md)" README.md || {
              echo "{{._LIB_ERR}} taskfiles · README.md does not link $m/README.md" >&2; fail=1; }
          done
          # A family shares one README for all its variants.
          for fam in {{.FAMILIES}}; do
            [ -f "$fam/README.md" ] || { echo "{{._LIB_ERR}} taskfiles · $fam/ has no README.md" >&2; fail=1; }
            grep -q "($fam/README.md)" README.md || {
              echo "{{._LIB_ERR}} taskfiles · README.md does not link $fam/README.md" >&2; fail=1; }
          done
          # And the reverse: a link to a README that is not on disk.
          for f in $(grep -oE '\(([a-z0-9-]+/)+README\.md\)' README.md | tr -d '()' | sort -u); do
            [ -f "$f" ] || { echo "{{._LIB_ERR}} taskfiles · README.md links $f, which is not in the repo" >&2; fail=1; }
          done
          [ "$fail" = 0 ] && echo "{{._LIB_OK}} taskfiles · every module has a README and the index links it"
          exit "$fail"

  check:surface:
    desc: "Refuse a family whose variants no longer expose the same tasks, or disagree on which ones need deps:"
    # python/poetry and python/uv are sold as interchangeable — a consumer
    # swaps one include line and every task name it calls still resolves. That
    # promise is only true while the two agree, and nothing else would notice
    # them drifting. Documented exceptions go in the allowlist below.
    #
    # Task NAMES are not the whole promise: python/poetry's test/lint/fmt went
    # a full release without `deps: [install]`, while python/uv had it from the
    # start — same three names in `--list-all`, but one variant ran `pytest`
    # against whatever venv happened to exist and the other always synced
    # first. That drift is invisible to a name-only diff, so shared tasks are
    # also compared on whether they declare `deps:` at all — not on the exact
    # list, which legitimately differs per tool. This half is best-effort: it
    # needs `yq` and warns rather than fails when that is missing, the same
    # tradeoff `release:chart:render` makes for its own optional parse gate.
    vars:
      # <family>:<task> that only one variant is expected to have.
      SURFACE_EXCEPT: "python:deps:update:latest"
      # <family>:<task> allowed to declare deps: on one variant and not another.
      # runtime:image:load is a real difference, not drift: docker and orbstack
      # share the daemon the build wrote to, so loading is a no-op with nothing
      # to depend on; k3d, kind and minikube each run their own store and must
      # depend on `check` to import into it.
      DEPS_EXCEPT: "runtime:image:load"
    cmds:
      - cmd: |-
          set -eu
          fail=0
          have_yq=0
          command -v yq >/dev/null 2>&1 && have_yq=1
          for fam in {{.FAMILIES}}; do
            first=""; base=""; basedeps=""
            for v in $(ls -d "$fam"/*/Taskfile.yaml 2>/dev/null | sed "s|/Taskfile.yaml||"); do
              got=$(task -t "$v/Taskfile.yaml" --list-all 2>/dev/null \
                    | grep -oE '^\* [a-z0-9:_-]+' | sed 's/^\* //; s/:$//' | sort)
              # Drop the tasks this family is allowed to differ on.
              for e in {{.SURFACE_EXCEPT}}; do
                case "$e" in
                  "$fam":*) got=$(printf '%s\n' "$got" | grep -vxF "${e#*:}" || true) ;;
                esac
              done

              deps=""
              if [ "$have_yq" = 1 ]; then
                deps=$(yq e '.tasks | to_entries | .[] | select(.value.deps != null) | .key' "$v/Taskfile.yaml" 2>/dev/null | sort)
                for e in {{.DEPS_EXCEPT}}; do
                  case "$e" in
                    "$fam":*) deps=$(printf '%s\n' "$deps" | grep -vxF "${e#*:}" || true) ;;
                  esac
                done
              fi

              if [ -z "$first" ]; then first="$v"; base="$got"; basedeps="$deps"; continue; fi
              if [ "$got" != "$base" ]; then
                echo "{{._LIB_ERR}} taskfiles · $v and $first do not expose the same tasks:" >&2
                diff <(printf '%s\n' "$base") <(printf '%s\n' "$got") | sed 's/^/    /' >&2
                fail=1
              fi
              if [ "$have_yq" = 1 ] && [ "$deps" != "$basedeps" ]; then
                echo "{{._LIB_ERR}} taskfiles · $v and $first disagree on which shared tasks declare deps::" >&2
                diff <(printf '%s\n' "$basedeps") <(printf '%s\n' "$deps") | sed 's/^/    /' >&2
                fail=1
              fi
            done
          done
          [ "$have_yq" = 1 ] || echo "{{._LIB_WARN}} taskfiles · yq absent, deps: parity within families not checked" >&2
          [ "$fail" = 0 ] && echo "{{._LIB_OK}} taskfiles · every family's variants expose the same tasks and agree on deps:"
          exit "$fail"

  check:runtime-install:
    desc: "Refuse a runtime/* variant whose install: task has drifted from the others"
    # install: is deliberately duplicated byte-for-byte across every runtime/*
    # variant rather than factored into a shared include: a nested include
    # resolves its `dir: .` against the FILE that declares it, not against
    # wherever the outermost include eventually runs — confirmed by hand, a
    # shared install: reads CHART_DIR against this checkout instead of the
    # consumer's, silently. Duplication is the safer choice here; this gate is
    # what keeps the five copies from quietly drifting apart instead.
    cmds:
      - cmd: |-
          set -eu
          fail=0
          first=""; base=""
          for f in runtime/*/Taskfile.yaml; do
            block=$(sed -n '/^  install:/,$p' "$f")
            if [ -z "$first" ]; then first="$f"; base="$block"; continue; fi
            if [ "$block" != "$base" ]; then
              echo "{{._LIB_ERR}} taskfiles · $f's install: has drifted from $first's:" >&2
              diff <(printf '%s\n' "$base") <(printf '%s\n' "$block") | sed 's/^/    /' >&2
              fail=1
            fi
          done
          [ "$fail" = 0 ] && echo "{{._LIB_OK}} taskfiles · every runtime/* install: task matches"
          exit "$fail"

  # ─── cutting a release ─────────────────────────────────────────────────────
  #
  # semantic-release (release.config.cjs) decides the NUMBER, from Conventional
  # Commits since the last tag. It never decides the MOMENT: both tasks below
  # are run by hand, only when a maintainer has already written the CHANGELOG
  # entry for that number — see RELEASE.md. Wiring semantic-release into CI on
  # every push to main would remove that moment entirely: every rebase-merged
  # commit is release-worthy under this file's own releaseRules (a deliberate
  # match to RELEASE.md's "everything else is a patch"), so an automatic run
  # would cut a release per merged PR, undoing the batching [Unreleased] exists
  # for.

  cut:next:
    desc: "Print the version semantic-release would cut from commits since the last tag"
    preconditions:
      - sh: command -v npx >/dev/null
        msg: "npx (Node.js) is not installed — https://nodejs.org/"
      - sh: test -d node_modules/semantic-release
        msg: "semantic-release is not installed — npm install"
    cmds:
      - cmd: |-
          set -eu
          out=$(npx semantic-release --dry-run --no-ci 2>&1) || { printf '%s\n' "$out" >&2; exit 1; }
          version=$(printf '%s\n' "$out" | sed -nE 's/.*next release version is ([0-9]+\.[0-9]+\.[0-9]+).*/v\1/p' | tail -1)
          if [ -z "$version" ]; then
            printf '%s\n' "$out" >&2
            echo "{{._LIB_WARN}} taskfiles · no release-worthy commits since the last tag" >&2
            exit 1
          fi
          echo "$version"

  cut:tag:
    desc: "Tag and push the release CHANGELOG.md already documents — refuses on a mismatch"
    preconditions:
      - sh: command -v npx >/dev/null
        msg: "npx (Node.js) is not installed — https://nodejs.org/"
      - sh: test -d node_modules/semantic-release
        msg: "semantic-release is not installed — npm install"
    cmds:
      - cmd: |-
          set -eu
          out=$(npx semantic-release --dry-run --no-ci 2>&1) || { printf '%s\n' "$out" >&2; exit 1; }
          computed=$(printf '%s\n' "$out" | sed -nE 's/.*next release version is ([0-9]+\.[0-9]+\.[0-9]+).*/v\1/p' | tail -1)
          if [ -z "$computed" ]; then
            printf '%s\n' "$out" >&2
            echo "{{._LIB_WARN}} taskfiles · no release-worthy commits since the last tag" >&2
            exit 1
          fi

          documented=$(sed -nE 's/^## \[([0-9]+\.[0-9]+\.[0-9]+)\].*/v\1/p' CHANGELOG.md | head -1)
          if [ "$computed" != "$documented" ]; then
            echo "{{._LIB_ERR}} taskfiles · semantic-release would cut ${computed}, but CHANGELOG.md's top entry is ${documented:-none} — cut the docs PR for ${computed} first (RELEASE.md)" >&2
            exit 1
          fi

          echo "{{._LIB_OK}} taskfiles · tagging ${documented}"
          npx semantic-release --no-ci

  # ─── docs ───────────────────────────────────────────────────────────────────

  surface:
    desc: "Print the task surface of every module — the library's public API"
    cmds:
      - for: { var: PARSE_MODULES }
        cmd: printf '\n── %s\n' '{{.ITEM}}' && task -t {{.ITEM}}/Taskfile.yaml --list-all | tail -n +2
