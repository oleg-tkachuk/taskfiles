version: "3"

# Development tasks for the library itself. Consumers never include this file
# — they include the modules beside it.

silent: true

vars:
  MODULES: "service.yaml go.yaml python.yaml node.yaml compose.yaml monorepo.yaml security.yaml argocd.yaml"

tasks:
  default:
    desc: "List every task"
    cmds:
      - task --list-all

  lint:
    desc: "Parse every module and fail on the first one Task cannot load"
    cmds:
      - for: { var: MODULES }
        task: _parse
        vars: { MODULE: "{{.ITEM}}" }
      - echo "✔ taskfiles · every module parses"

  _parse:
    internal: true
    cmds:
      - task -t {{.MODULE}} --list-all >/dev/null
      - echo "  ✔ {{.MODULE}}"

  surface:
    desc: "Print the task surface of every module — the library's public API"
    cmds:
      - for: { var: MODULES }
        cmd: printf '\n── %s\n' '{{.ITEM}}' && task -t {{.ITEM}} --list-all | tail -n +2
