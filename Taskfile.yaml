version: "3"

# Development tasks for the library itself. Consumers never include this file —
# they include the modules beside it.
#
# `task lint` is the whole gate: the git hooks and CI both call these tasks
# rather than carrying their own copy of the checks, so there is one place a
# rule is written down and one place it changes.

silent: true

vars:
  # One directory per module, and an include names the directory rather than a
  # file inside it. The split is by domain, not by file size: `release` never
  # talks to a cluster and `k8s` never publishes anything, so a repository that
  # only does one of the two includes only one of them.
  # Modules with their own README. A family — a directory with no Taskfile of
  # its own whose subdirectories have one — shares a single README, so those
  # are checked separately; hence the top-level glob rather than PARSE_MODULES.
  # Discovered for the same reason PARSE_MODULES is: the hand-written list had
  # gone four modules stale (checkov, codegen, helm, sealed-secrets), and a
  # module missing from it walked past the README gate rather than failing it.
  #
  # demo/ is excluded from every list below: it is a consumer of this library,
  # not a module in it — its Taskfile owns bare var names the way a real
  # consumer's does, and has no README of its own to require.
  MODULES:
    sh: ls -d */Taskfile.yaml 2>/dev/null | grep -v '^demo/' | sed "s|/Taskfile.yaml||" | sort | tr "\n" " "
  # Everything that must parse, the runtime variants included.
  # Discovered, not listed: a hand-maintained list is one a new module can be
  # left out of, and a module outside it escapes the parse gate in silence.
  PARSE_MODULES:
    sh: ls -d */Taskfile.yaml */*/Taskfile.yaml 2>/dev/null | grep -v '^demo/' | sed "s|/Taskfile.yaml||" | sort | tr "\n" " "
  # Every YAML the modules are made of, for the file-level checks.
  MODULE_FILES:
    sh: ls */Taskfile.yaml */*/Taskfile.yaml 2>/dev/null | grep -v '^demo/' | sort -u | tr '\n' ' '
  # runtime, python — the directories that hold variants rather than a module.
  FAMILIES:
    sh: ls -d */*/Taskfile.yaml 2>/dev/null | grep -v '^demo/' | cut -d/ -f1 | sort -u | tr '\n' ' '
  # The CI scripts: one TypeScript command per workflow step, and their tests.
  _CI_DIR: .github/ci
  # Status markers. The shape carries the meaning, so a line still reads in
  # a monochrome log; the colour sits on top and drops out under NO_COLOR.
  _LIB_OK: '{{if .NO_COLOR}}✔{{else}}{{"\x1b[32m✔\x1b[0m"}}{{end}}'
  _LIB_WARN: '{{if .NO_COLOR}}▲{{else}}{{"\x1b[33m▲\x1b[0m"}}{{end}}'
  _LIB_ERR: '{{if .NO_COLOR}}✖{{else}}{{"\x1b[31m✖\x1b[0m"}}{{end}}'

tasks:
  default:
    desc: "List every task"
    cmds:
      - task --list-all

  lint:
    desc: "Run every gate: modules parse, vars are scoped, output is quiet, README matches, tasks behave"
    cmds:
      - task: check:parse
      - task: check:vars
      - task: check:scope
      - task: check:silent
      - task: check:readme
      - task: check:surface
      - task: check:api
      - task: check:runtime
      - task: check:python
      - task: check:quoting
      - task: check:behaviour
      - task: check:ci-scripts
      - task: check:renovate

  # ─── gates ──────────────────────────────────────────────────────────────────

  check:parse:
    desc: "Load every module through Task's own parser"
    # The authoritative check: it catches what a YAML parser cannot — an
    # unknown key, a template that does not compile, a `for:` over something
    # that is not a list.
    cmds:
      - for: { var: PARSE_MODULES }
        task: _parse
        vars: { MODULE: "{{.ITEM}}" }
      - printf '%s\n' "{{._LIB_OK}} taskfiles · every module parses"

  _parse:
    internal: true
    cmds:
      - task -t {{.MODULE}}/Taskfile.yaml --list-all >/dev/null
      - printf '%s\n' "  {{._LIB_OK}} {{.MODULE}}"

  check:vars:
    desc: "Refuse a module var that is not prefixed, or a module that uses two prefixes"
    # Two rules, one reason. A var declared in an included Taskfile SHADOWS the
    # including file's value of the same name, and every include shares one
    # namespace — so a module declaring `PROJECT_NAME:` would silently override
    # every consumer's, and two modules declaring `_IMAGE:` differently would
    # each mean something else by it.
    #
    # So: read inputs inline as `{{`{{`}}.NAME | default "..."{{`}}`}}`, and give
    # every declared var this module's own prefix — `_REL_`, `_GO_`, `_CS_`.
    # A cross-module read (runtime and cosign read `_REL_VERSION`) is a read:
    # the module must not declare it, and the module that does must name it on
    # its `# exports:` line — the contract between the two.
    #
    # A task's own vars too, unless the var is the input itself — see
    # scripts/check-vars.sh.
    cmds:
      - bash scripts/check-vars.test.sh >/dev/null
      - cmd: |-
          set -eu
          bash scripts/check-vars.sh {{.MODULE_FILES}}
          printf '%s\n' "{{._LIB_OK}} taskfiles · every module var is scoped to its own module"

  check:scope:
    desc: "Refuse a module var that resolves an input the caller passes on the task call"
    # A var in a module's top-level `vars:` block is evaluated in that file's
    # own scope. It sees what the CONSUMER set at include time — and nothing a
    # caller passes on the call itself (`task: argocd:refresh` with
    # `vars: {APP_PREFIX: ...}`). So a module var written to pre-chew such an
    # input resolves to empty while the task it feeds sees the real value.
    #
    # This is silent in the worst way. argocd/refresh filtered applications
    # with `grep -E {{`'`}}^$_ARGO_PREFIX{{`'`}}`, the prefix came back empty, the pattern
    # became `^`, and a task documented as touching one release hard-refreshed
    # all 69 applications in the cluster — including the infra ones its own
    # comment said must never be touched. It reported success every time.
    #
    # An input a task `requires:` is by definition allowed to arrive at call
    # time. Read it where it is used, not in the vars block.
    #
    # scripts/check-scope.sh reads `requires:` in every form it takes — a flow
    # list, a block list, {name:, enum:} — where the awk it replaced read the
    # flow form alone.
    cmds:
      - bash scripts/check-scope.test.sh >/dev/null
      - cmd: |-
          set -eu
          bash scripts/check-scope.sh {{.MODULE_FILES}}
          printf '%s\n' "{{._LIB_OK}} taskfiles · no module var resolves a call-time input"

  check:silent:
    desc: "Refuse a module that does not run quiet"
    # Without `silent: true` Task echoes every command before running it, and
    # the deliberate ◉/✔/○ marker lines drown in a transcript of the commands
    # that produced them.
    cmds:
      - cmd: |-
          set -eu
          fail=0
          for f in {{.MODULE_FILES}}; do
            grep -qE '^silent: true$' "$f" || { printf '%s\n' "{{._LIB_ERR}} taskfiles · $f does not declare 'silent: true'" >&2; fail=1; }
          done
          [ "$fail" = 0 ] && printf '%s\n' "{{._LIB_OK}} taskfiles · every module runs quiet"
          exit "$fail"

  check:quoting:
    desc: "Refuse a value that reaches a shell without going through q"
    # A value interpolated into a script is code: inside double quotes a
    # $(...) in it runs, bare it is word-split. Only the inputs a module
    # declares as shell (`# shell-verbatim:`) may go in unquoted.
    # demo/ is held to it too: it is the example a consumer copies.
    cmds:
      - bash scripts/check-quoting.test.sh >/dev/null
      - cmd: |-
          set -eu
          bash scripts/check-quoting.sh {{.MODULE_FILES}} demo/Taskfile.yaml
          printf '%s\n' "{{._LIB_OK}} taskfiles · every value reaches the shell quoted"

  check:behaviour:
    desc: "Run each module's behaviour tests against shimmed tools"
    # Loading a module proves it parses. These run its tasks, with the tools it
    # calls replaced by shims that record their argv, and assert on what the
    # task did with its inputs: which context a destructive call went to,
    # whether a failure reached the exit code. One file per module, under
    # tests/, discovered so a new one cannot be left out.
    cmds:
      - for: { var: _BEHAVIOUR_TESTS }
        cmd: bash {{.ITEM | q}} >/dev/null
      - printf '%s\n' "{{._LIB_OK}} taskfiles · every module behaves as its tests say"
    vars:
      _BEHAVIOUR_TESTS:
        sh: ls tests/*.test.sh 2>/dev/null | sort | tr '\n' ' '

  check:ci-scripts:
    desc: "Refuse a workflow script kept in the YAML, a CI command nothing runs, or one that fails its types or tests"
    # A script inside a workflow is checked by nothing and runs nowhere but CI.
    # Steps run `node .github/ci/<command>.ts` instead; one-command steps stay
    # inline. Node runs the TypeScript as it is, so tsc only checks it.
    # shellcheck is best-effort: it warns rather than fails where it is not
    # installed.
    deps: [ci:install]
    cmds:
      - '{{print ._CI_DIR "/node_modules/.bin/tsc" | q}} -p {{._CI_DIR | q}}'
      - node --test --test-reporter=dot {{print ._CI_DIR "/**/*.test.ts" | q}}
      # Spelt out rather than built from _CI_DIR: check-workflows finds the
      # commands a task runs by their path, itself included.
      - node .github/ci/check-workflows.ts .
      - cmd: |-
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck -S warning scripts/*.sh tests/*.sh
          else
            printf '%s\n' "{{._LIB_WARN}} taskfiles · shellcheck absent, scripts/ and tests/ not linted" >&2
          fi
      - printf '%s\n' "{{._LIB_OK}} taskfiles · every workflow script lives in .github/ci, is run, and passes its types and tests"

  ci:install:
    desc: "Install the CI scripts' locked dependencies"
    # Skipped while node_modules is newer than the lockfile: npm ci rewrites
    # it whole, and a lockfile change is the only thing that makes it stale.
    sources: ['{{._CI_DIR}}/package-lock.json']
    generates: ['{{._CI_DIR}}/node_modules/.package-lock.json']
    cmds:
      - node {{._CI_DIR | q}}/install.ts {{._CI_DIR | q}}

  check:renovate:
    desc: "Refuse a Renovate pin, allow-list or guard that has stopped working"
    # Renovate fails all of these in silence: a pin its regex no longer
    # matches gets no pull request, a post-upgrade command off the allow-list
    # is skipped with a log line. Nothing else here would turn red.
    cmds:
      - bash scripts/check-renovate.test.sh >/dev/null
      - bash scripts/check-renovate.sh
      - printf '%s\n' "{{._LIB_OK}} taskfiles · every Renovate pin is matched and every guard is in place"

  check:readme:
    desc: "Refuse a module with no README, or one the top-level README does not link"
    # The table in README.md is the map people navigate by, and a module's own
    # README is where they land. A module missing from either is a module nobody
    # finds; a link to a file that is not there sends them nowhere.
    cmds:
      - cmd: |-
          set -eu
          fail=0
          for m in {{.MODULES}}; do
            [ -f "$m/README.md" ] || { printf '%s\n' "{{._LIB_ERR}} taskfiles · $m/ has no README.md" >&2; fail=1; }
            grep -q "($m/README.md)" README.md || {
              printf '%s\n' "{{._LIB_ERR}} taskfiles · README.md does not link $m/README.md" >&2; fail=1; }
          done
          # A family shares one README for all its variants.
          for fam in {{.FAMILIES}}; do
            [ -f "$fam/README.md" ] || { printf '%s\n' "{{._LIB_ERR}} taskfiles · $fam/ has no README.md" >&2; fail=1; }
            grep -q "($fam/README.md)" README.md || {
              printf '%s\n' "{{._LIB_ERR}} taskfiles · README.md does not link $fam/README.md" >&2; fail=1; }
          done
          # And the reverse: a link to a README that is not on disk.
          for f in $(grep -oE '\(([a-z0-9-]+/)+README\.md\)' README.md | tr -d '()' | sort -u); do
            [ -f "$f" ] || { printf '%s\n' "{{._LIB_ERR}} taskfiles · README.md links $f, which is not in the repo" >&2; fail=1; }
          done
          [ "$fail" = 0 ] && printf '%s\n' "{{._LIB_OK}} taskfiles · every module has a README and the index links it"
          exit "$fail"

  check:api:
    desc: "Refuse a task, alias or input the latest release had and this tree has lost"
    # A name that vanishes without a `!` on its commit reaches consumers as a
    # minor, and breaks every Taskfile that called it. A rename keeps the old
    # name for a major instead (RELEASE.md); a deliberate removal is named in
    # API_REMOVED, and its commit carries the `!`. The base is the newest
    # release this commit descends from, read with git, so no tag is fetched
    # over the network and nothing about a consumer is assumed.
    vars:
      # <module>:<name> removed on purpose, each with its reason in a comment
      # above it, or <module>:* for a whole module. Empty again once the major
      # that removes them has shipped — check-api.sh reports a stale entry.
      API_REMOVED: ""
    cmds:
      - bash scripts/check-api.test.sh >/dev/null
      - cmd: |-
          set -eu
          base=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD 2>/dev/null) || {
            printf '%s\n' "{{._LIB_ERR}} taskfiles · no release tag in this clone to compare the API against — git fetch --tags" >&2
            exit 1
          }
          # Every module in this tree and in the release, so a module removed
          # since is compared too.
          files=$( { printf '%s\n' {{.MODULE_FILES}}; git ls-tree -r --name-only "$base" | grep -E '^[^/]+/([^/]+/)?Taskfile.yaml$' | grep -v '^demo/'; } | sort -u)
          # shellcheck disable=SC2086 # one path per word, by construction
          bash scripts/check-api.sh "$base" {{.API_REMOVED | q}} $files
          printf '%s\n' "{{._LIB_OK}} taskfiles · nothing $base offered is gone without being named"

  check:surface:
    desc: "Refuse a family whose variants no longer expose the same tasks, or disagree on which ones need deps:"
    # python/poetry and python/uv are sold as interchangeable — a consumer
    # swaps one include line and every task name it calls still resolves. That
    # promise is only true while the two agree, and nothing else would notice
    # them drifting. Documented exceptions go in the allowlist below. Aliases
    # count as names: a renamed task keeps its old name as one for a major
    # (RELEASE.md), and a consumer calls it on whichever variant it includes.
    #
    # Task NAMES are not the whole promise: python/poetry's test/lint/fmt went
    # a full release without `deps: [install]`, while python/uv had it from the
    # start — same three names in `--list-all`, but one variant ran `pytest`
    # against whatever venv happened to exist and the other always synced
    # first. That drift is invisible to a name-only diff, so shared tasks are
    # also compared on whether they declare `deps:` at all — not on the exact
    # list, which legitimately differs per tool.
    vars:
      # <family>:<task> that only one variant is expected to have.
      SURFACE_EXCEPT: "python:deps:update:latest"
      # <family>:<task> allowed to declare deps: on one variant and not another.
      # runtime:image:load is a real difference, not drift: docker and orbstack
      # share the daemon the build wrote to, so loading is a no-op with nothing
      # to depend on; k3d, kind and minikube each run their own store and must
      # depend on `check` to import into it.
      DEPS_EXCEPT: "runtime:image:load"
    cmds:
      - cmd: |-
          set -eu
          fail=0
          for fam in {{.FAMILIES}}; do
            first=""; base=""; basedeps=""
            for v in $(ls -d "$fam"/*/Taskfile.yaml 2>/dev/null | sed "s|/Taskfile.yaml||"); do
              got=$(task -t "$v/Taskfile.yaml" --list-all --json | yq -p json -r '.tasks[] | [.name] + (.aliases // []) | .[]' | sort)
              # Drop the tasks this family is allowed to differ on.
              for e in {{.SURFACE_EXCEPT}}; do
                case "$e" in
                  "$fam":*) got=$(printf '%s\n' "$got" | grep -vxF "${e#*:}" || true) ;;
                esac
              done

              deps=$(yq e '.tasks | to_entries | .[] | select(.value.deps != null) | .key' "$v/Taskfile.yaml" | sort)
              for e in {{.DEPS_EXCEPT}}; do
                case "$e" in
                  "$fam":*) deps=$(printf '%s\n' "$deps" | grep -vxF "${e#*:}" || true) ;;
                esac
              done

              if [ -z "$first" ]; then first="$v"; base="$got"; basedeps="$deps"; continue; fi
              if [ "$got" != "$base" ]; then
                printf '%s\n' "{{._LIB_ERR}} taskfiles · $v and $first do not expose the same tasks:" >&2
                diff <(printf '%s\n' "$base") <(printf '%s\n' "$got") | sed 's/^/    /' >&2
                fail=1
              fi
              if [ "$deps" != "$basedeps" ]; then
                printf '%s\n' "{{._LIB_ERR}} taskfiles · $v and $first disagree on which shared tasks declare deps::" >&2
                diff <(printf '%s\n' "$basedeps") <(printf '%s\n' "$deps") | sed 's/^/    /' >&2
                fail=1
              fi
            done
          done
          [ "$fail" = 0 ] && printf '%s\n' "{{._LIB_OK}} taskfiles · every family's variants expose the same tasks and agree on deps:"
          exit "$fail"

  check:runtime:
    desc: "Refuse a runtime/* variant that has drifted from the others outside its own cluster handling"
    # Every runtime/* file is duplicated byte-for-byte except the parts that
    # are the runtime itself, rather than factored into a shared include: a
    # nested include resolves its `dir: .` against the FILE that declares it,
    # not against wherever the outermost include eventually runs — confirmed
    # by hand, a shared install: reads CHART_DIR against this checkout instead
    # of the consumer's, silently. Duplication is the safer choice; this gate
    # is what keeps the five copies from quietly drifting apart. It compared
    # install: alone once, and the vars every task reads could drift unseen.
    vars:
      # What a variant owns: how it checks its cluster, how it loads an image,
      # and the vars that name the cluster and the context. Comments go too.
      _RUNTIME_SHARED: 'del(.tasks.check, .tasks["image:load"], .vars._RT_CTX, .vars._RT_CLUSTER, .vars._RT_PROFILE) | ... comments=""'
    cmds:
      - cmd: |-
          set -eu
          fail=0
          first=""; base=""
          for f in runtime/*/Taskfile.yaml; do
            shared=$(yq {{._RUNTIME_SHARED | q}} "$f")
            if [ -z "$first" ]; then first="$f"; base="$shared"; continue; fi
            if [ "$shared" != "$base" ]; then
              printf '%s\n' "{{._LIB_ERR}} taskfiles · $f has drifted from $first outside its own cluster handling:" >&2
              diff <(printf '%s\n' "$base") <(printf '%s\n' "$shared") | sed 's/^/    /' >&2
              fail=1
            fi
          done
          [ "$fail" = 0 ] && printf '%s\n' "{{._LIB_OK}} taskfiles · every runtime/* variant matches outside its own cluster handling"
          exit "$fail"

  check:python:
    desc: "Refuse a python/* variant whose tool-neutral tasks have drifted from the other's"
    # poetry and uv cannot share a file — every task that installs, locks or
    # reports calls its own manager — but the tasks that only run a tool inside
    # the environment are the same task twice. python/poetry's test, lint and
    # fmt once went a release without the `deps: [install]` python/uv had, and
    # check:surface caught the deps: half of that only. These are compared
    # whole, once the three things that may differ are made the same: the var
    # prefix, the manager's `run`, and the label in the log line.
    vars:
      # Tasks that call nothing of the manager's but `run`.
      _PYTHON_SHARED: test lint fmt typecheck
      _PYTHON_NORMALISE: 's/_(PY|UV)_/_X_/g; s/(poetry|uv) run/RUN/g; s/ · (py|uv) · / · X · /g'
    cmds:
      - cmd: |-
          set -eu
          fail=0
          for t in {{._PYTHON_SHARED}}; do
            a=$(yq ".tasks[\"$t\"] | ... comments=\"\"" python/poetry/Taskfile.yaml | sed -E {{._PYTHON_NORMALISE | q}})
            b=$(yq ".tasks[\"$t\"] | ... comments=\"\"" python/uv/Taskfile.yaml | sed -E {{._PYTHON_NORMALISE | q}})
            if [ "$a" != "$b" ]; then
              printf '%s\n' "{{._LIB_ERR}} taskfiles · python/uv's $t has drifted from python/poetry's:" >&2
              diff <(printf '%s\n' "$a") <(printf '%s\n' "$b") | sed 's/^/    /' >&2
              fail=1
            fi
          done
          [ "$fail" = 0 ] && printf '%s\n' "{{._LIB_OK}} taskfiles · python/* variants agree on their tool-neutral tasks"
          exit "$fail"

  # ─── docs ───────────────────────────────────────────────────────────────────

  surface:
    desc: "Print the task surface of every module — the library's public API"
    cmds:
      - for: { var: PARSE_MODULES }
        cmd: printf '\n── %s\n' '{{.ITEM}}' && task -t {{.ITEM}}/Taskfile.yaml --list-all | tail -n +2
