version: "3"

# ─────────────────────────────────────────────────────────────────────────────
# hcloud — the power state of the Hetzner Cloud servers a project owns, and a
# console for the one that will not boot.
#
#   includes:
#     hcloud:
#       taskfile: '{{printf .TASKLIB "hcloud"}}'
#       dir: .
#
# Every task except `console` acts on EVERY server the selector matches, which
# is what makes one command work on a single server and on five. The selector
# is therefore the whole safety boundary: an empty one matches every server in
# the project, so a missing value is refused rather than widened.
#
# What this is not: a wrapper per API call. `hcloud server` alone also has
# rebuild, change-type, rescue mode, ISO attachment, backups, snapshots, RDNS
# and metrics — each of them either fights whatever provisions the servers for
# ownership of them, or is a one-off an operator is better off typing. Use the
# CLI for those; this module is the handful a project reaches for while
# operating what it already has.
#
# Nothing here saves money. A Hetzner server is billed while it EXISTS, not
# while it runs, so stopping one changes nothing on the invoice.
#
# ── Inputs ───────────────────────────────────────────────────────────────────
#   PROJECT_NAME          the label in every log line
#   HCLOUD_SELECTOR       label selector naming the servers          (required)
#   HCLOUD_SELECTOR_CMD   a command printing one, when it has to be looked up
#   HCLOUD_TOKEN_CMD      a command printing the API token
#   HCLOUD_SERVER         the server for hcloud:console
#   HCLOUD_LIST_COLUMNS   columns for hcloud:servers
#
# HCLOUD_TOKEN from the environment is what the CLI itself reads, so a shell
# that already exports one needs neither input. HCLOUD_TOKEN_CMD is for a
# project that keeps the token somewhere it has to be fetched from: it runs
# inside the task, not at parse time, so `task --list` never reaches for a
# credential.
#
# Nothing here is declared under a bare knob name: a var declared in an
# included file shadows the including file's value of the same name, so every
# input is read as `{{.NAME | default …}}` and every derived value is prefixed
# `_HC_`.
# ─────────────────────────────────────────────────────────────────────────────

silent: true

vars:
  _HC_SVC: '{{.PROJECT_NAME | default "servers"}}'
  _HC_COLUMNS: '{{.HCLOUD_LIST_COLUMNS | default "name,status,type,location,ipv4,private_net"}}'

  # Status markers. The shape carries the meaning, so a line still reads in
  # a monochrome log; the colour sits on top and drops out under NO_COLOR.
  _HC_RUN: '{{if .NO_COLOR}}◉{{else}}{{"\x1b[36m◉\x1b[0m"}}{{end}}'
  _HC_OK: '{{if .NO_COLOR}}✔{{else}}{{"\x1b[32m✔\x1b[0m"}}{{end}}'
  _HC_WARN: '{{if .NO_COLOR}}▲{{else}}{{"\x1b[33m▲\x1b[0m"}}{{end}}'
  _HC_ERR: '{{if .NO_COLOR}}✖{{else}}{{"\x1b[31m✖\x1b[0m"}}{{end}}'

  # The token, resolved inside the task rather than in an `env:` stanza. Task
  # evaluates `env:` BEFORE preconditions, so a token fetched there runs before
  # the check that would have explained why it could not be.
  _HC_TOKEN: |
    if [ -n "{{.HCLOUD_TOKEN_CMD}}" ]; then
      HCLOUD_TOKEN="$({{.HCLOUD_TOKEN_CMD}})"
      export HCLOUD_TOKEN
    fi
    if [ -z "${HCLOUD_TOKEN:-}" ]; then
      printf '%s\n' "{{._HC_ERR}} {{._HC_SVC}} · hcloud · no HCLOUD_TOKEN, and no HCLOUD_TOKEN_CMD to get one from" >&2
      exit 1
    fi

  # The selector, and the servers it matches. One spelling, because every task
  # below needs both and all of them must refuse an empty match rather than
  # loop zero times and report success.
  _HC_EACH_SERVER: |
    selector="{{.HCLOUD_SELECTOR}}"
    if [ -z "$selector" ] && [ -n "{{.HCLOUD_SELECTOR_CMD}}" ]; then
      selector="$({{.HCLOUD_SELECTOR_CMD}})"
    fi
    if [ -z "$selector" ]; then
      printf '%s\n' "{{._HC_ERR}} {{._HC_SVC}} · hcloud · no HCLOUD_SELECTOR: an empty one matches every server in the project" >&2
      exit 1
    fi
    servers="$(hcloud server list -l "$selector" -o noheader -o columns=name)"
    if [ -z "$servers" ]; then
      printf '%s\n' "{{._HC_ERR}} {{._HC_SVC}} · hcloud · no server matches $selector" >&2
      exit 1
    fi

tasks:

  servers:
    desc: "Power state of every server the selector matches"
    preconditions:
      - sh: command -v hcloud >/dev/null
        msg: "hcloud CLI not installed — https://github.com/hetznercloud/cli"
    cmds:
      # The only task here that changes nothing.
      - cmd: |
          set -euo pipefail
          {{._HC_TOKEN}}
          {{._HC_EACH_SERVER}}
          hcloud server list -l "$selector" -o columns={{._HC_COLUMNS}}

  poweron:
    desc: "Power the servers on — nothing else can, a stopped server runs no agent"
    preconditions:
      - sh: command -v hcloud >/dev/null
        msg: "hcloud CLI not installed — https://github.com/hetznercloud/cli"
    cmds:
      # No prompt: starting a stopped server takes nothing away, and this is
      # the task an operator reaches for when something else already did.
      - cmd: |
          set -euo pipefail
          {{._HC_TOKEN}}
          {{._HC_EACH_SERVER}}

          for server in $servers; do
            hcloud server poweron "$server"
          done

          printf '\n'
          printf '%s\n' "{{._HC_OK}} {{._HC_SVC}} · hcloud · powered on — the guests need a moment"

  shutdown:
    desc: "ACPI shutdown — the power button, and the guest decides what to do with it"
    preconditions:
      - sh: command -v hcloud >/dev/null
        msg: "hcloud CLI not installed — https://github.com/hetznercloud/cli"
    prompt: "Send an ACPI shutdown to every server matching {{.HCLOUD_SELECTOR}}{{.HCLOUD_SELECTOR_CMD}}?"
    cmds:
      # Graceful at the machine level and nowhere else: Hetzner sends the ACPI
      # event and the guest acts on it, so whatever runs inside learns about it
      # by going away rather than by being told first.
      - cmd: |
          set -euo pipefail
          {{._HC_TOKEN}}
          {{._HC_EACH_SERVER}}

          for server in $servers; do
            hcloud server shutdown "$server"
          done

          printf '\n'
          printf '%s\n' "{{._HC_OK}} {{._HC_SVC}} · hcloud · shutdown sent — back up with hcloud:poweron"

  reboot:
    desc: "ACPI reboot — for a server whose kernel lives but whose agent does not"
    preconditions:
      - sh: command -v hcloud >/dev/null
        msg: "hcloud CLI not installed — https://github.com/hetznercloud/cli"
    prompt: "Send an ACPI reboot to every server matching {{.HCLOUD_SELECTOR}}{{.HCLOUD_SELECTOR_CMD}}?"
    cmds:
      # The middle rung. Whatever runs inside the server has its own restart
      # and is the one to prefer; `reset` below cuts the power and is the one
      # to fall back to. This asks the kernel, which is what is left when the
      # guest's own agent has stopped answering and the machine has not
      # stopped running.
      - cmd: |
          set -euo pipefail
          {{._HC_TOKEN}}
          {{._HC_EACH_SERVER}}

          for server in $servers; do
            hcloud server reboot "$server"
          done

          printf '\n'
          printf '%s\n' "{{._HC_OK}} {{._HC_SVC}} · hcloud · reboot sent"

  poweroff:
    desc: "Cut power without a clean shutdown — for when the guest cannot answer"
    preconditions:
      - sh: command -v hcloud >/dev/null
        msg: "hcloud CLI not installed — https://github.com/hetznercloud/cli"
    prompt: "Cut power to every server matching {{.HCLOUD_SELECTOR}}{{.HCLOUD_SELECTOR_CMD}} without a clean shutdown?"
    cmds:
      # The plug. Anything mid-write inside the server is mid-write when the
      # power goes, so this is the right command only when the guest has
      # stopped answering — its own shutdown is otherwise strictly better.
      - cmd: |
          set -euo pipefail
          {{._HC_TOKEN}}
          {{._HC_EACH_SERVER}}

          for server in $servers; do
            hcloud server poweroff "$server"
          done

          printf '\n'
          printf '%s\n' "{{._HC_OK}} {{._HC_SVC}} · hcloud · power cut — back up with hcloud:poweron"

  reset:
    desc: "Hard reset — a power cut and a start in one, for an unresponsive server"
    preconditions:
      - sh: command -v hcloud >/dev/null
        msg: "hcloud CLI not installed — https://github.com/hetznercloud/cli"
    prompt: "Hard reset every server matching {{.HCLOUD_SELECTOR}}{{.HCLOUD_SELECTOR_CMD}}? No clean shutdown."
    cmds:
      # For the server that has stopped answering entirely, where the
      # alternative is poweroff followed by poweron and a wait in between.
      - cmd: |
          set -euo pipefail
          {{._HC_TOKEN}}
          {{._HC_EACH_SERVER}}

          for server in $servers; do
            hcloud server reset "$server"
          done

          printf '\n'
          printf '%s\n' "{{._HC_OK}} {{._HC_SVC}} · hcloud · reset sent"

  console:
    desc: "Open a VNC console on one server — the only way to watch one that will not boot (HCLOUD_SERVER=<name>)"
    preconditions:
      - sh: command -v hcloud >/dev/null
        msg: "hcloud CLI not installed — https://github.com/hetznercloud/cli"
    cmds:
      # One server rather than the whole selector, because a console for five
      # at once is not a thing. The name is checked against the selector
      # first: a project's account holds servers this selector does not cover,
      # and `hcloud server request-console` on one of those works perfectly.
      #
      # What it prints is a credential — console access to the machine, which
      # is root on it. Hetzner expires it shortly, and there is no way to use
      # one without a person reading it, so it is printed. Keep it out of
      # anything that logs.
      - cmd: |
          set -euo pipefail
          {{._HC_TOKEN}}
          {{._HC_EACH_SERVER}}

          if [ -z "{{.HCLOUD_SERVER}}" ]; then
            printf '%s\n' "{{._HC_ERR}} {{._HC_SVC}} · hcloud · console needs a server. The selector matches:" >&2
            printf '  %s\n' $servers >&2
            exit 1
          fi

          found=no
          for server in $servers; do
            if [ "$server" = "{{.HCLOUD_SERVER}}" ]; then
              found=yes
            fi
          done

          if [ "$found" = no ]; then
            printf '%s\n' "{{._HC_ERR}} {{._HC_SVC}} · hcloud · {{.HCLOUD_SERVER}} is not matched by the selector. It matches:" >&2
            printf '  %s\n' $servers >&2
            exit 1
          fi

          printf '%s\n' "{{._HC_WARN}} {{._HC_SVC}} · hcloud · the url and password below are console access, and short-lived"
          printf '\n'
          hcloud server request-console "{{.HCLOUD_SERVER}}"
