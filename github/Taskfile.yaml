version: "3"

# ─────────────────────────────────────────────────────────────────────────────
# github — repository administration that has to be done deliberately.
#
#   includes:
#     github:
#       taskfile: '{{printf .TASKLIB "github"}}'
#       dir: .
#       vars: { GH_REPO: owner/name }
#
# ── Inputs ───────────────────────────────────────────────────────────────────
# Pass these at the include's own `vars:`, not the consumer's top-level
# `vars:` — see README.md#variable-scoping.
#
#   GH_REPO      owner/name           (default: the origin remote)
#   GH_BRANCH    protected branch     (default: main)
#   GH_REMOTE    git remote to push   (default: origin)
#
# ── Why this module exists ───────────────────────────────────────────────────
# A protected `main` with `enforce_admins` on refuses EVERY direct ref update,
# force or not — measured, not assumed: a push and a `--force` push were both
# declined with "5 of 5 required status checks are expected". GitHub has no
# "admins follow the rules except for force-push" setting, and a ruleset bypass
# is whole-ruleset, so it would hand back every rule at once.
#
# So the escape hatch is a toggle, and a toggle is exactly the thing a human
# does correctly on the way in and forgets on the way out. That forgetting is
# not hypothetical: `enforce_admins` sat at false in this repository while
# CONTRIBUTING.md said "there is no direct push, for anyone", and the gap was
# found only because a direct push succeeded that should not have.
#
# `force-push` therefore restores the flag from an EXIT trap, which covers a
# successful push and a failed one alike. It does NOT cover a hard interrupt:
# the shell Task runs commands in accepts `trap … EXIT` and rejects every other
# signal — measured, `trap: INT: invalid signal specification` — so Ctrl-C
# between the two API calls can leave protection down. The task therefore
# prints the one-line restore command BEFORE it lifts anything, so the way back
# is already in the scrollback when it is needed.
# ─────────────────────────────────────────────────────────────────────────────

silent: true

tasks:

  force-push:
    desc: "Force-push a protected branch: drop enforce_admins, push, restore it"
    summary: |
      REASON is required and is not decoration — it is what the next reader
      sees when they ask why protection was off for ninety seconds.

        task github:force-push REASON="drop the secret from 3 published commits"

      REF defaults to HEAD. The flag is restored even when the push fails.
    vars:
      _GH_REPO:
        sh: '{{if .GH_REPO}}echo {{.GH_REPO | q}}{{else}}gh repo view --json nameWithOwner -q .nameWithOwner{{end}}'
      _GH_BRANCH: '{{.GH_BRANCH | default "main"}}'
      _GH_REMOTE: '{{.GH_REMOTE | default "origin"}}'
      REF: '{{.REF | default "HEAD"}}'
    preconditions:
      - sh: command -v gh >/dev/null
        msg: "gh is not installed — https://cli.github.com"
      - sh: '{{if .REASON}}true{{else}}false{{end}}'
        msg: "REASON is required: task github:force-push REASON=\"…\""
    cmds:
      - cmd: |-
          set -eu
          repo={{._GH_REPO | q}}; branch={{._GH_BRANCH | q}}; remote={{._GH_REMOTE | q}}
          api="repos/$repo/branches/$branch/protection/enforce_admins"

          # Protection comes down on $repo, so the push has to land there.
          # GH_REPO and the remote are set apart, and nothing else ties them:
          # with the remote on a fork, protection was lifted on one repository
          # and the force-push sent to another. The push URL, not the fetch
          # URL: a remote with a pushurl sends the push there.
          url=$(git remote get-url --push "$remote")
          path=${url%.git}; path=${path%/}
          name=${path##*/}; owner=${path%/*}; owner=${owner##*[/:]}
          lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }
          if [ "$(lower "$owner/$name")" != "$(lower "$repo")" ]; then
            echo "✖ remote '$remote' is $url, not $repo — refusing to lift protection on one and push to the other." >&2
            echo "  Set GH_REMOTE to the remote for $repo, or GH_REPO to the repository '$remote' points at." >&2
            exit 1
          fi

          # Only restore what was actually on. Turning it ON afterwards when it
          # had been OFF would be this task inventing policy rather than
          # borrowing it for one command.
          was_on=$(gh api "$api" --jq .enabled 2>/dev/null || echo "unknown")
          if [ "$was_on" != "true" ]; then
            echo "enforce_admins is already '$was_on' on $repo@$branch — nothing to lift."
            echo "Refusing: this task exists to reopen a CLOSED door, and this one is open."
            exit 1
          fi

          # Printed BEFORE the flag comes down, not after. EXIT is the only
          # trap this shell accepts, so a hard interrupt in the next few
          # seconds is the one path that leaves protection off — and then this
          # line is already on screen.
          echo "   if this dies, restore protection with:  gh api -X POST $api"

          # Restored once, by whichever comes first: the explicit call after the
          # push, or the EXIT trap when anything before it fails. A restore that
          # fails is the task failing, whatever the push did — the protection
          # is still off, and an exit status of 0 would say otherwise.
          restored=0
          restore() {
            [ "$restored" = 0 ] || return 0
            restored=1
            if gh api -X POST "$api" >/dev/null 2>&1; then
              echo "✔ enforce_admins restored on $repo@$branch"
            else
              echo "✖ COULD NOT RESTORE enforce_admins on $repo@$branch — run the line above NOW" >&2
              return 1
            fi
          }
          trap restore EXIT

          printf '▲ lifting enforce_admins on %s@%s — %s\n' "$repo" "$branch" {{.REASON | q}}
          gh api -X DELETE "$api" >/dev/null
          pushed=0
          git push --force-with-lease "$remote" {{.REF | q}}:"$branch" || pushed=$?
          restore || exit 1
          exit "$pushed"
